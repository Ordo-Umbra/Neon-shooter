// AUDIO  (Web Audio API — procedurally synthesised, no external files)
// ================================================================
let soundMuted = localStorage.getItem('neon_muted') === '1';
let audioCtx = null;
function getAudioCtx() {
    if (!audioCtx) audioCtx = new AudioContext();
    return audioCtx;
}
function playSound(type) {
    if(soundMuted) return;
    try {
        const ac = getAudioCtx();
        const osc = ac.createOscillator();
        const gain = ac.createGain();
        osc.connect(gain); gain.connect(ac.destination);
        const t = ac.currentTime;
        switch (type) {
            case 'shoot':
                osc.type = 'square';
                osc.frequency.setValueAtTime(880, t);
                osc.frequency.exponentialRampToValueAtTime(440, t + 0.06);
                gain.gain.setValueAtTime(0.07, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
                osc.start(t); osc.stop(t + 0.08);
                break;
            case 'enemyDie':
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(320, t);
                osc.frequency.exponentialRampToValueAtTime(60, t + 0.15);
                gain.gain.setValueAtTime(0.14, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
                osc.start(t); osc.stop(t + 0.16);
                break;
            case 'bossHit':
                osc.type = 'square';
                osc.frequency.setValueAtTime(160, t);
                osc.frequency.exponentialRampToValueAtTime(70, t + 0.12);
                gain.gain.setValueAtTime(0.18, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
                osc.start(t); osc.stop(t + 0.14);
                break;
            case 'bossDie':
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, t);
                osc.frequency.exponentialRampToValueAtTime(28, t + 0.9);
                gain.gain.setValueAtTime(0.4, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 1.0);
                osc.start(t); osc.stop(t + 1.0);
                break;
            case 'hit':
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, t);
                osc.frequency.exponentialRampToValueAtTime(80, t + 0.22);
                gain.gain.setValueAtTime(0.28, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
                osc.start(t); osc.stop(t + 0.25);
                break;
            case 'shieldHit':
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1400, t);
                osc.frequency.exponentialRampToValueAtTime(400, t + 0.14);
                gain.gain.setValueAtTime(0.15, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
                osc.start(t); osc.stop(t + 0.16);
                break;
            case 'powerup':
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, t);
                osc.frequency.setValueAtTime(660, t + 0.1);
                osc.frequency.setValueAtTime(880, t + 0.2);
                gain.gain.setValueAtTime(0.2, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
                osc.start(t); osc.stop(t + 0.35);
                break;
            case 'levelComplete':
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523, t);
                osc.frequency.setValueAtTime(659, t + 0.12);
                osc.frequency.setValueAtTime(784, t + 0.24);
                osc.frequency.setValueAtTime(1047, t + 0.36);
                gain.gain.setValueAtTime(0.22, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.55);
                osc.start(t); osc.stop(t + 0.55);
                break;
            case 'gameover':
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, t);
                osc.frequency.exponentialRampToValueAtTime(55, t + 0.7);
                gain.gain.setValueAtTime(0.32, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.8);
                osc.start(t); osc.stop(t + 0.8);
                break;
            case 'laser':
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(1200, t);
                osc.frequency.linearRampToValueAtTime(800, t + 0.05);
                gain.gain.setValueAtTime(0.06, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
                osc.start(t); osc.stop(t + 0.07);
                break;
            case 'nuke':
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(80, t);
                osc.frequency.exponentialRampToValueAtTime(20, t + 0.6);
                gain.gain.setValueAtTime(0.5, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.7);
                osc.start(t); osc.stop(t + 0.7);
                break;
            case 'combo':
                osc.type = 'sine';
                osc.frequency.setValueAtTime(660, t);
                osc.frequency.setValueAtTime(880, t + 0.05);
                osc.frequency.setValueAtTime(1100, t + 0.10);
                gain.gain.setValueAtTime(0.12, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
                osc.start(t); osc.stop(t + 0.18);
                break;
        }
    } catch(e) {}
}

function handleTap() {
    // Mute button: top-right corner 40x40 area
    if(lastClickX > W-48 && lastClickX < W-8 && lastClickY > 8 && lastClickY < 48) {
        soundMuted = !soundMuted;
        localStorage.setItem('neon_muted', soundMuted ? '1' : '0');
        return;
    }
    // Easter egg: tap corners in sequence TL>TR>BR>BL for temp invincibility
    if(gameState === 'playing') {
        const _cx=lastClickX, _cy=lastClickY, _cz=W*0.15, _cz2=H*0.15;
        const isTL=_cx<_cz&&_cy<_cz2, isTR=_cx>W-_cz&&_cy<_cz2;
        const isBR=_cx>W-_cz&&_cy>H-_cz2, isBL=_cx<_cz&&_cy>H-_cz2;
        const cornerOrder=[isTL,isTR,isBR,isBL];
        if(cornerOrder[cornerSeq]) {
            cornerSeq++; cornerTimer=300;
            if(cornerSeq>=4) {
                cornerSeq=0; cornerTimer=0; cornerInvincTimer=600;
                floatingTexts.push({x:W/2,y:H*0.5,text:'\u25CE INVINCIBILITY! (10s)',color:'#0ff',life:2.5,decay:0.006,vy:-0.4});
                playSound('powerup');
            }
        } else if(!cornerOrder.some(Boolean)) { cornerSeq=0; }
    }
    if(gameState === 'paused') { gameState = pausedFromState || 'playing'; return; }
    if(gameState === 'title') {
        // Easter egg: tap title 7 times fast
        titleTapCount++; titleTapTimer = 180;
        if(titleTapCount >= 7) {
            titleTapCount = 0;
            ownedHulls = ownedHulls.map(()=>true);
            ownedColors = ownedColors.map(()=>true);
            ownedEngines = ownedEngines.map(()=>true);
            scraps += 500; devModeUnlocked = true;
            for(let i=0;i<40;i++) spawnParticles(Math.random()*W, Math.random()*H, ['#f0f','#0ff','#ff0','#0f0'][i%4], 5);
            floatingTexts.push({x:W/2,y:H*0.5,text:'\u2605 DEV MODE UNLOCKED \u2605',color:'#ff0',life:3,decay:0.005,vy:-0.3});
        }
        if(lastClickY > H*0.78 && lastClickY < H*0.91) { gameState = 'guide'; guideScrollY = 0; }
        else if(lastClickY > H*0.67 && lastClickY < H*0.78) { startEndless(); }
        else if(lastClickY > H*0.55 && lastClickY < H*0.67) { gameState = 'dlcSelect'; }
        else { gameState = 'intro'; }
    }
    else if(gameState === 'guide')         { gameState = 'title'; }
    else if(gameState === 'intro')         { startLevel(currentLevelIdx); }
    else if(gameState === 'levelComplete') {
        if(dlcMode) { advanceDlcLevel(); return; }
        if(lastClickY > H*0.78 && lastClickY < H*0.91) {
            gameState = 'shop';
        } else if(customizationUnlocked && lastClickY > H*0.62 && lastClickY < H*0.78) {
            gameState = 'customize';
        } else { nextLevel(); }
    }
    else if(gameState === 'shop') {
        // Tab bar click
        if(lastClickY >= H*0.245 && lastClickY < H*0.31) {
            shopTab = (lastClickX < W/2) ? 'upgrades' : 'parts';
        } else if(shopTab === 'upgrades') {
            const rH = H*0.108, r0 = H*0.365;
            if(lastClickY >= r0 && lastClickY < r0+rH) {
                if(scraps >= 15 && player.hp < player.maxHp) { scraps -= 15; player.hp++; }
            } else if(lastClickY >= r0+rH && lastClickY < r0+2*rH) {
                if(scraps >= 30 && upgrades.fireRate < 2) { scraps -= 30; upgrades.fireRate++; }
            } else if(lastClickY >= r0+2*rH && lastClickY < r0+3*rH) {
                if(scraps >= 50 && upgrades.maxHpBonus < 2) { scraps -= 50; upgrades.maxHpBonus++; player.maxHp = 3 + upgrades.maxHpBonus; }
            } else if(lastClickY >= r0+3*rH && lastClickY < r0+4*rH) {
                if(scraps >= 20 && !upgrades.shieldOnStart) { scraps -= 20; upgrades.shieldOnStart = true; }
            } else if(lastClickY >= r0+4*rH && lastClickY < r0+5*rH) {
                if(scraps >= 50 && !spreadShotUpgrade) { scraps -= 50; spreadShotUpgrade = true; }
            } else if(lastClickY >= r0+5*rH && lastClickY < r0+6*rH) {
                if(scraps >= 60 && armorUpgrade < 1) { scraps -= 60; armorUpgrade++; }
            } else if(lastClickY >= r0+6*rH && lastClickY < r0+7*rH) {
                if(scraps >= 80 && !droneActive) { scraps -= 80; droneActive = true; droneX = player.x; droneY = player.y; }
            } else if(lastClickY >= r0+7*rH && lastClickY < r0+8*rH) {
                if(scraps >= 40 && healOnKillUpgrade < 3) { scraps -= 40; healOnKillUpgrade++; }
            } else if(lastClickY >= r0+8*rH && lastClickY < r0+9*rH) {
                if(scraps >= 35 && scrapBonusUpgrade < 2) { scraps -= 35; scrapBonusUpgrade++; }
            } else if(lastClickY > H*0.89) { gameState = 'levelComplete'; }
        } else {

            if(lastClickY >= H*0.325 && lastClickY < H*0.385) {
                if(lastClickX < W*0.38) partsSubTab = 'hulls';
                else if(lastClickX < W*0.66) partsSubTab = 'colors';
                else partsSubTab = 'engines';
            } else {
                const itemH = H*0.072, itemStart = H*0.395;
                const idx = Math.floor((lastClickY - itemStart) / itemH);
                if(idx >= 0 && lastClickY < H*0.89) {
                    if(partsSubTab === 'hulls') {
                        const shopIdxs = HULL_PRICES.map((_,i)=>i).filter(i=>HULL_PRICES[i]>0);
                        if(idx < shopIdxs.length) {
                            const hi = shopIdxs[idx];
                            if(!ownedHulls[hi] && scraps >= HULL_PRICES[hi]) { scraps -= HULL_PRICES[hi]; ownedHulls[hi] = true; }
                        }
                    } else if(partsSubTab === 'colors') {
                        const shopIdxs = COLOR_PRICES.map((_,i)=>i).filter(i=>COLOR_PRICES[i]>0);
                        if(idx < shopIdxs.length) {
                            const ci = shopIdxs[idx];
                            if(!ownedColors[ci] && scraps >= COLOR_PRICES[ci]) { scraps -= COLOR_PRICES[ci]; ownedColors[ci] = true; }
                        }
                    } else {
                        const shopIdxs = ENGINE_PRICES.map((_,i)=>i).filter(i=>ENGINE_PRICES[i]>0);
                        if(idx < shopIdxs.length) {
                            const ei = shopIdxs[idx];
                            if(!ownedEngines[ei] && scraps >= ENGINE_PRICES[ei]) { scraps -= ENGINE_PRICES[ei]; ownedEngines[ei] = true; }
                        }
                    }
                }
            }
            if(lastClickY > H*0.89) gameState = 'levelComplete';
        }
    }
    else if(gameState === 'customize') {
        if(lastClickY >= H*0.34 && lastClickY < H*0.46) {
            shipConfig.hull = nextOwned(ownedHulls, shipConfig.hull);
        } else if(lastClickY >= H*0.46 && lastClickY < H*0.58) {
            shipConfig.color = nextOwned(ownedColors, shipConfig.color);
        } else if(lastClickY >= H*0.58 && lastClickY < H*0.73) {
            shipConfig.engine = nextOwned(ownedEngines, shipConfig.engine);
        } else if(lastClickY >= H*0.73) {
            gameState = 'levelComplete';
        }
    }
    else if(gameState === 'bossLore') {
        levelBonus = killCount * 3 + 150 + (dlcMode ? dlcLevelIdx : currentLevelIdx) * 15;
        score += levelBonus;
        if(!dlcMode && currentLevelIdx >= 2) customizationUnlocked = true;
        gameState = 'levelComplete';
    }
    else if(gameState === 'gameover') {
        if(lastClickY > H*0.77) { endlessMode=false; resetGame(); }
        else { if(endlessMode) startEndless(); else retryLevel(); }
    }
    else if(gameState === 'victory')       { resetGame(); }
    else if(gameState === 'dlcVictory')    { dlcMode=false; activeDlc=null; allies=[]; resetGame(); }
    else if(gameState === 'dlcSelect') {
        if(lastClickY > H*0.92) { gameState = 'title'; return; }
        const cols2 = 2, cardW2 = W * 0.42, cardH2 = H * 0.22;
        const startX2 = W * 0.05, startY2 = H * 0.2;
        const padX2 = W * 0.08, padY2 = H * 0.03;
        for(let i=0;i<DLC_DATA.length;i++) {
            const col2=i%cols2, row2=Math.floor(i/cols2);
            const cx2=startX2+col2*(cardW2+padX2), cy2=startY2+row2*(cardH2+padY2);
            if(lastClickX>=cx2 && lastClickX<=cx2+cardW2 && lastClickY>=cy2 && lastClickY<=cy2+cardH2) {
                startDlc(i); return;
            }
        }
    }
}

function nextOwned(arr, current) {
    const len = arr.length;
    for(let i = 1; i <= len; i++) {
        const next = (current + i) % len;
        if(arr[next]) return next;
    }
    return current;
}

function getHullName(idx) {
    return idx < 10 ? HULL_NAMES[idx] : (bossHullNames[idx-10] || 'BOSS');
}

function startEndless() {
    endlessMode = true; endlessWave = 0; endlessNextBoss = 50;
    score = 0; levelStartScore = 0; currentLevelIdx = 0;

    scraps=0; screenShake=0; comboCount=0; comboTimer=0; nukeFlash=0; freezeTimer=0; overdriveTimer=0;

    return [{type:'titan',w:3},{type:'vanguard',w:3},{type:'bomber',w:3},{type:'sniper',w:3},{type:'berserker',w:2},{type:'carrier',w:1},{type:'lancer',w:3},{type:'stealth',w:2}];

function updateAllies() {
    for(let ai = allies.length-1; ai >= 0; ai--) {
        const ally = allies[ai];
        const side = (ai % 2 === 0) ? -65 : 65;
        const row = Math.floor(ai / 2);
        const tx = player.x + side;
        const ty = player.y + 35 + row * 45;
        ally.x += (tx - ally.x) * 0.07;
        ally.y += (ty - ally.y) * 0.07;
        ally.fireTimer++;
        if(ally.fireTimer >= 35) {
            ally.fireTimer = 0;
            let bvx = 0, bvy = -8;
            let minD = 99999;
            bots.forEach(b => {
                const d = Math.hypot(b.x+b.size/2-ally.x, b.y+b.size/2-ally.y);
                if(d < minD) { minD=d; const dx2=b.x+b.size/2-ally.x, dy2=b.y+b.size/2-ally.y, dist2=Math.hypot(dx2,dy2)||1; bvx=dx2/dist2*8; bvy=dy2/dist2*8; }
            });
            if(boss) { const dx2=boss.x+60-ally.x, dy2=boss.y+45-ally.y, dist2=Math.hypot(dx2,dy2)||1; if(dist2<minD){bvx=dx2/dist2*8; bvy=dy2/dist2*8;} }
            bullets.push({x:ally.x+6, y:ally.y, vx:bvx, vy:bvy, v:bvy, enemy:false, ally:true, width:3, bColor:ally.color});
        }
        if(ally.invincFrames > 0) ally.invincFrames--;
    }
}

function drawAlly(ally) {
    const sz = 10;
    ctx.save(); ctx.translate(ally.x + 6, ally.y + 6);
    if(ally.invincFrames > 0 && Math.floor(ally.invincFrames/3)%2===0) { ctx.restore(); return; }
    ctx.shadowBlur=14; ctx.shadowColor=ally.color; ctx.fillStyle=ally.color;
    ctx.beginPath();
    ctx.moveTo(0,-sz); ctx.lineTo(sz*0.55,sz*0.65); ctx.lineTo(0,sz*0.25); ctx.lineTo(-sz*0.55,sz*0.65);
    ctx.closePath(); ctx.fill();
    ctx.shadowBlur=0;
    for(let i=0;i<ally.maxHp;i++) {
        ctx.fillStyle = i < ally.hp ? '#0f0' : '#030';
        ctx.fillRect(-sz*0.5 + i*8, sz*0.8, 6, 3);
    }
    ctx.restore();

function startLevel(idx) {
    levelStartScore = score; killCount = 0; bossKilledThisLevel = false; fireTimer = 0;
    bots=[]; bullets=[]; powerups=[]; boss=null; particles=[];
    player.x = W/2-12; player.y = H*0.82; player.invincFrames = 60;
    player.maxHp = 3 + upgrades.maxHpBonus;
    player.hp = Math.min(player.hp, player.maxHp);
    levelStartedWithShield = upgrades.shieldOnStart;
    if(upgrades.shieldOnStart) { player.shieldActive = true; upgrades.shieldOnStart = false; }
    floatingTexts = [];
    randomEventTimer = 700; activeEventText = ''; activeEventDisplayTimer = 0;
    bonusScrapActive = false; bonusScrapTimer = 0;
    comboCount = 0; comboTimer = 0; nukeFlash = 0; freezeTimer = 0; overdriveTimer = 0;
    const lvl = LEVELS[idx];
    stars.forEach(s => s.color = lvl.starColor || '#fff');
    if(lvl.boss) {
        boss = Object.assign({}, lvl.boss, { x:W/2-60, y:80, dir:lvl.boss.speed, shootTimer:0 });
    }
    gameState = 'playing';
}

function nextLevel() {
    currentLevelIdx++;
    if(currentLevelIdx >= LEVELS.length) {
        if(score > highScore) { highScore = score; localStorage.setItem('neon_hs', highScore); }
        gameState = 'victory';
    }
    else { gameState = 'intro'; }
}

function retryLevel() {
    score = levelStartScore;
    if(levelStartedWithShield) upgrades.shieldOnStart = true;
    const rMaxHp = 3 + upgrades.maxHpBonus;
    player = { x:W/2-12, y:H*0.82, hp:rMaxHp, maxHp:rMaxHp, invincFrames:0, shieldActive:false, rapidTimer:0, laserTimer:0 };
    bots=[]; bullets=[]; particles=[]; powerups=[]; boss=null;
    killCount=0; bossKilledThisLevel=false; fireTimer=0; floatingTexts=[]; freezeTimer=0; overdriveTimer=0; comboCount=0; comboTimer=0; nukeFlash=0;
    levelDamageReceived=0; levelIntroTimer=120; bossEnraged=false; homingMissiles=[]; mineActive=[]; timewarpTimer=0; magnetTimer=0; ghostTimer=0;
    gameState = 'intro';
}

function checkLevelComplete() {
    if(gameState !== 'playing') return;
    if(endlessMode) return;
    if(dlcMode) { checkDlcLevelComplete(); return; }
    const lvl = LEVELS[currentLevelIdx];
    const done = lvl.boss ? bossKilledThisLevel : (killCount >= lvl.quota);
    if(done) {
        levelBonus = killCount * 3 + (lvl.boss ? 150 : 50) + currentLevelIdx * 15;
        score += levelBonus;
        if(currentLevelIdx >= 2) customizationUnlocked = true; // level 3 is index 2 — parts unlock here
        gameState = 'levelComplete';
        playSound('levelComplete');
    }
}

function checkDlcLevelComplete() {
    if(gameState !== 'playing') return;
    if(!dlcMode) return;
    const lvl = DLC_DATA[activeDlc].levels[dlcLevelIdx];
    const done = lvl.boss ? bossKilledThisLevel : (killCount >= lvl.quota);
    if(done) {
        levelBonus = killCount * 3 + (lvl.boss ? 150 : 50) + dlcLevelIdx * 15;
        score += levelBonus;
        if(dlcLevelIdx >= 49) {
            if(score > highScore) { highScore = score; localStorage.setItem('neon_hs', highScore); }
            gameState = 'dlcVictory';
        } else {
            gameState = 'levelComplete';
        }
        playSound('levelComplete');
    }
}

function advanceDlcLevel() {
    dlcLevelIdx++;
    if(dlcLevelIdx >= DLC_DATA[activeDlc].levels.length) {
        if(score > highScore) { highScore = score; localStorage.setItem('neon_hs', highScore); }
        gameState = 'dlcVictory';
        return;
    }
    killCount = 0; bossKilledThisLevel = false; fireTimer = 0;
    bots=[]; bullets=[]; powerups=[]; boss=null; particles=[];

    stars.forEach(s => s.color = DLC_DATA[activeDlc].color);
    if(lvl.boss) {
        boss = Object.assign({}, lvl.boss, { x:W/2-60, y:80, dir:lvl.boss.speed, shootTimer:0 });

function drawDlcSelectScreen() {
    ctx.fillStyle='rgba(0,0,0,0.92)'; ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    ctx.shadowBlur=22; ctx.shadowColor='#0ff'; ctx.fillStyle='#0ff';
    ctx.font='bold 26px Courier New';
    ctx.fillText('SELECT DLC CAMPAIGN', W/2, H*0.09);
    ctx.shadowBlur=0; ctx.fillStyle='#888'; ctx.font='13px Courier New';
    ctx.fillText('Choose your campaign — 50 levels each, unique ally & exclusive enemies', W/2, H*0.155);

    const cols = 2;
    const cardW = W * 0.42, cardH = H * 0.22;
    const startX = W * 0.05, startY = H * 0.2;
    const padX = W * 0.08, padY = H * 0.03;

    DLC_DATA.forEach((dlc, i) => {
        const col = i % cols, row = Math.floor(i / cols);
        const cx = startX + col * (cardW + padX);
        const cy = startY + row * (cardH + padY);

        ctx.save();
        ctx.shadowBlur=16; ctx.shadowColor=dlc.color;
        ctx.strokeStyle=dlc.color; ctx.lineWidth=2;
        ctx.fillStyle='rgba(0,0,0,0.7)';
        ctx.fillRect(cx, cy, cardW, cardH);
        ctx.strokeRect(cx, cy, cardW, cardH);
        ctx.restore();

        ctx.shadowBlur=14; ctx.shadowColor=dlc.color; ctx.fillStyle=dlc.color;
        ctx.font='bold 17px Courier New'; ctx.textAlign='center';
        ctx.fillText(dlc.name + ' DLC', cx + cardW/2, cy + cardH*0.28);

        ctx.shadowBlur=0; ctx.fillStyle='#bbb'; ctx.font='12px Courier New';
        ctx.fillText(dlc.tagline, cx + cardW/2, cy + cardH*0.50);

        ctx.fillStyle='#999'; ctx.font='12px Courier New';
        ctx.fillText('ALLY: ' + dlc.allyName, cx + cardW/2, cy + cardH*0.70);

        ctx.fillStyle='#666'; ctx.font='11px Courier New';
        ctx.fillText('50 LEVELS  |  10 BOSS FIGHTS', cx + cardW/2, cy + cardH*0.88);
    });

    ctx.shadowBlur=12; ctx.shadowColor='#0af'; ctx.fillStyle='#0af';
    ctx.font='bold 14px Courier New'; ctx.textAlign='center';
    ctx.fillText('◄  BACK TO MENU', W/2, H*0.955);
    ctx.shadowBlur=0; ctx.textAlign='left';
}

function spawnParticles(cx, cy, color, count) {
    for(let i = 0; i < count; i++) {
        const a = Math.random()*Math.PI*2, spd = Math.random()*5+0.5;
        particles.push({ x:cx, y:cy, vx:Math.cos(a)*spd, vy:Math.sin(a)*spd,
            life:1.0, decay:Math.random()*0.04+0.015, r:Math.random()*3.5+1, color });
    }
}

function maybeDropPowerup(ex, ey) {
    if(Math.random() > 0.13) return;
    let types, weights;
    if(dlcMode && activeDlc !== null) {
        const dlcPow=[['dlc0_surge','dlc0_link','dlc0_aura'],['dlc1_flare','dlc1_fuel','dlc1_nova'],['dlc2_drift','dlc2_warp','dlc2_shield'],['dlc3_frenzy','dlc3_blood','dlc3_rage'],['dlc4_blizzard','dlc4_armor','dlc4_nova'],['dlc5_phase','dlc5_rift','dlc5_echo']];
        types=['health','rapid','shield','overdrive','freeze',...dlcPow[activeDlc]];
        weights=[4,3,3,2,2,2,1,1];
    } else {
        types=['health','rapid','shield','laser','nuke','overdrive','freeze','homing','timewarp','magnet','ghost','mine'];
        weights=[5,3,3,2,1,2,2,1,1,1,1,1];
    }
    let total = weights.reduce((a,b)=>a+b,0), r = Math.random()*total;
    let type = types[0];
    for(let i=0;i<types.length;i++){r-=weights[i];if(r<=0){type=types[i];break;}}
    powerups.push({ x:ex, y:ey, type, vy:1.4, life:320 });
}

    if(type==='dlc5_phase')    { ghostTimer=Math.max(ghostTimer,480); overdriveTimer=Math.max(overdriveTimer,480); floatingTexts.push({x:player.x+12,y:player.y-20,text:'PHANTOM PHASE!',color:'#0f8',life:1.5,decay:0.015,vy:-1.5}); playSound('powerup'); return; }
    if(type==='dlc5_rift')     { let k=0; const sorted=[...bots].sort((a,b)=>b.hp-a.hp); for(let i=0;i<Math.min(10,bots.length);i++){const t=sorted[i];const idx=bots.indexOf(t);if(idx>=0){spawnParticles(t.x+t.size/2,t.y+t.size/2,t.color,12);killCount++;score+=5;bots.splice(idx,1);k++;}} checkLevelComplete(); floatingTexts.push({x:W/2,y:H*.4,text:'PHANTOM RIFT: -'+k+' ENEMIES',color:'#0f8',life:1.8,decay:0.012,vy:-0.8}); playSound('powerup'); return; }

    else if(type === 'laser') { player.laserTimer = 360; }
    else if(type === 'overdrive') { overdriveTimer = 480; }
    else if(type === 'homing') { homingMissileTimer = 600;
        for(let i=0;i<3;i++) homingMissiles.push({x:player.x+12,y:player.y,vx:(i-1)*3,vy:-5,life:300});
        floatingTexts.push({x:player.x+12,y:player.y-20,text:'HOMING MISSILES!',color:'#f80',life:1.2,decay:0.02,vy:-1.5}); }
    else if(type === 'timewarp') { timewarpTimer = 600;
        floatingTexts.push({x:W/2,y:H*0.4,text:'TIME WARP!',color:'#8ff',life:1.5,decay:0.015,vy:-0.8}); }
    else if(type === 'magnet') { magnetTimer = 400;
        floatingTexts.push({x:player.x+12,y:player.y-20,text:'MAGNET!',color:'#f0f',life:1.0,decay:0.025,vy:-1.5}); }
    else if(type === 'ghost') { ghostTimer = 480;
        floatingTexts.push({x:player.x+12,y:player.y-20,text:'GHOST MODE!',color:'#aaf',life:1.0,decay:0.025,vy:-1.5}); }
    else if(type === 'mine') {
        for(let i=0;i<3;i++) mineActive.push({x:player.x+12+(i-1)*30,y:player.y+20,life:600,armed:false,armTimer:60});
        floatingTexts.push({x:player.x+12,y:player.y-20,text:'MINES PLACED!',color:'#f40',life:1.0,decay:0.025,vy:-1.5}); }
    else if(type === 'scrap') { const sg = Math.ceil(1*(1+scrapBonusUpgrade*0.25)); scraps+=sg;
        floatingTexts.push({x:player.x+12,y:player.y-15,text:'+'+sg+'sc',color:'#ff0',life:0.8,decay:0.03,vy:-1.3}); return; }
    else if(type === 'freeze') { freezeTimer = 180; screenShake=8; spawnParticles(W/2,H/2,'#8ff',40); playSound('powerup'); return; }
    else if(type === 'nuke') {
        nukeFlash = 18;
        const killed = bots.length;
        for(let bi=bots.length-1;bi>=0;bi--){
            spawnParticles(bots[bi].x+bots[bi].size/2,bots[bi].y+bots[bi].size/2,bots[bi].color,16);
            maybeDropPowerup(bots[bi].x+bots[bi].size/2,bots[bi].y+bots[bi].size/2);
            score += 2;
            killCount++;
        }
        bots=[];
        if(boss){boss.hp=Math.max(1,boss.hp-Math.ceil(boss.maxHp*0.35));spawnParticles(boss.x+60,boss.y+45,boss.color,30);}
        screenShake=20;
        playSound('nuke');
        if(killed>0) checkLevelComplete();
        spawnParticles(W/2,H/2,'#ff8',55);
        return;
    }
    spawnParticles(player.x+12, player.y+12, type==='health'?'#0f0':type==='rapid'?'#ff0':type==='laser'?'#f8f':'#0ff', 18);
    playSound('powerup');
}

function playerHit() {
    if(gameState !== 'playing' || player.invincFrames > 0) return;
    if(dlcArmorHits > 0) { dlcArmorHits--; spawnParticles(player.x+12,player.y+12,'#0ff',6); floatingTexts.push({x:player.x+12,y:player.y,text:'ARMOR!',color:'#0ff',life:0.8,decay:0.03,vy:-2.0}); return; }
    screenShake = 14;
    if(player.shieldActive) {
        player.shieldActive = false; player.invincFrames = 80;
        spawnParticles(player.x+12, player.y+12, '#0ff', 12);
        playSound('shieldHit');
        return;
    }
    const dmgAmt = Math.max(1, 1 - armorUpgrade);
    player.hp -= dmgAmt; player.invincFrames = 120;
    levelDamageReceived += dmgAmt;
    spawnParticles(player.x+12, player.y+12, '#f44', 15);
    playSound('hit');
    if(player.hp <= 0) { if(score > highScore) { highScore = score; localStorage.setItem('neon_hs', highScore); } gameState = 'gameover'; playSound('gameover'); }
}

function drawPlayerShip(cx, cy, color) {
    const sz = 14;
    ctx.save(); ctx.translate(cx, cy);
    ctx.shadowBlur=18; ctx.shadowColor=color; ctx.fillStyle=color;
    if(shipConfig.hull >= 10) {
        const _bi = shipConfig.hull - 10;
        if(_bi < bossHullShapes.length) {
            const _bw = sz*1.8, _bh = sz*1.3;
            drawBossShip(-_bw*0.5, -_bh*0.5, _bw, _bh, color, bossHullShapes[_bi]);
        }
    } else {
    ctx.beginPath();
    switch(shipConfig.hull) {
        case 1: // ANGULAR - bladed swept wings
            ctx.moveTo(0,-sz*1.1); ctx.lineTo(sz*0.7,sz*0.2); ctx.lineTo(sz*0.35,sz*0.75);
            ctx.lineTo(0,sz*0.35); ctx.lineTo(-sz*0.35,sz*0.75); ctx.lineTo(-sz*0.7,sz*0.2);
            break;
        case 2: // WIDE - broad delta wings
            ctx.moveTo(0,-sz*0.85); ctx.lineTo(sz*0.85,sz*0.55); ctx.lineTo(sz*0.45,sz*0.75);
            ctx.lineTo(0,sz*0.45); ctx.lineTo(-sz*0.45,sz*0.75); ctx.lineTo(-sz*0.85,sz*0.55);
            break;
        case 3: // SLEEK - narrow dart
            ctx.moveTo(0,-sz*1.3); ctx.lineTo(sz*0.32,sz*0.2);
            ctx.lineTo(0,sz*0.75); ctx.lineTo(-sz*0.32,sz*0.2);
            break;
        case 4: // RAZOR - ultra-slim aggressive dart
            ctx.moveTo(0,-sz*1.4); ctx.lineTo(sz*0.18,sz*0.0);
            ctx.lineTo(sz*0.42,sz*0.55); ctx.lineTo(0,sz*0.3);
            ctx.lineTo(-sz*0.42,sz*0.55); ctx.lineTo(-sz*0.18,sz*0.0);
            break;
        case 5: // PHANTOM — ghost needle with swept wing-tips
            ctx.moveTo(0,-sz*1.5); ctx.lineTo(sz*0.15,sz*0.0);
            ctx.lineTo(sz*0.55,sz*0.52); ctx.lineTo(sz*0.2,sz*0.38);
            ctx.lineTo(0,sz*0.7);
            ctx.lineTo(-sz*0.2,sz*0.38); ctx.lineTo(-sz*0.55,sz*0.52);
            ctx.lineTo(-sz*0.15,sz*0.0);
            break;
        case 6: // TITAN — wide armoured battle-cruiser
            ctx.moveTo(0,-sz*0.75); ctx.lineTo(sz*0.95,sz*0.1);
            ctx.lineTo(sz*0.88,sz*0.75); ctx.lineTo(sz*0.28,sz*0.88);
            ctx.lineTo(0,sz*0.6);
            ctx.lineTo(-sz*0.28,sz*0.88); ctx.lineTo(-sz*0.88,sz*0.75);
            ctx.lineTo(-sz*0.95,sz*0.1);
            break;
        case 7: // BLADE — pure scalpel shape
            ctx.moveTo(0,-sz*1.6); ctx.lineTo(sz*0.12,sz*0.1);
            ctx.lineTo(sz*0.62,sz*0.78); ctx.lineTo(0,sz*0.52);
            ctx.lineTo(-sz*0.62,sz*0.78); ctx.lineTo(-sz*0.12,sz*0.1);
            break;
        case 8: // DIAMOND — perfect rhombus with cut corners
            ctx.moveTo(0,-sz*1.1); ctx.lineTo(sz*0.5,-sz*0.18);
            ctx.lineTo(sz*0.75,sz*0.2); ctx.lineTo(sz*0.38,sz*0.88);
            ctx.lineTo(0,sz*0.65);
            ctx.lineTo(-sz*0.38,sz*0.88); ctx.lineTo(-sz*0.75,sz*0.2);
            ctx.lineTo(-sz*0.5,-sz*0.18);
            break;
        case 9: // VIPER — swept fangs with twin tail fins
            ctx.moveTo(0,-sz*1.25); ctx.lineTo(sz*0.22,sz*0.05);
            ctx.lineTo(sz*0.68,sz*0.28); ctx.lineTo(sz*0.48,sz*0.62);
            ctx.lineTo(sz*0.18,sz*0.44); ctx.lineTo(0,sz*0.55);
            ctx.lineTo(-sz*0.18,sz*0.44); ctx.lineTo(-sz*0.48,sz*0.62);
            ctx.lineTo(-sz*0.68,sz*0.28); ctx.lineTo(-sz*0.22,sz*0.05);
            break;
        default: // STANDARD - original shape
            ctx.moveTo(0,-sz); ctx.lineTo(sz*0.55,sz*0.65); ctx.lineTo(0,sz*0.25); ctx.lineTo(-sz*0.55,sz*0.65);
    }
    ctx.closePath(); ctx.fill();
    } // end boss hull else
    const engCol = ENGINE_COLORS[shipConfig.engine];
    ctx.shadowBlur=12; ctx.shadowColor=engCol; ctx.fillStyle=engCol;
    ctx.beginPath(); ctx.ellipse(0,sz*0.55,sz*0.18,sz*0.12,0,0,Math.PI*2); ctx.fill();
    ctx.restore();
}

    for(let i=0;i<9;i++){

        for(let i=3;i>=0;i--){const wx=bh*0.4-(i+0.5)*(bh*0.8/4);ctx.lineTo(wx+(i%2===0?0.08:-0.08)*bh,bh*0.2);}
        ctx.lineTo(-bh*0.4,bh*0.4);ctx.closePath();ctx.fill();
        ctx.globalAlpha=0.3;ctx.strokeStyle=color;ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,-bh*0.1,bh*0.52,Math.PI,0);ctx.stroke();ctx.globalAlpha=1;
        ctx.fillStyle='rgba(0,0,0,0.7)';ctx.beginPath();ctx.ellipse(-bh*0.15,-bh*0.15,bh*0.1,bh*0.07,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(bh*0.15,-bh*0.15,bh*0.1,bh*0.07,0,0,Math.PI*2);ctx.fill();
        ctx.shadowBlur=20;ctx.shadowColor='#fff';ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(-bh*0.15,-bh*0.15,bh*0.05,bh*0.04,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(bh*0.15,-bh*0.15,bh*0.05,bh*0.04,0,0,Math.PI*2);ctx.fill();

    } else if(shape === 'eternalphantom') {
        const epp=Date.now()*0.003,off=Math.sin(epp)*8;
        ctx.globalAlpha=0.35;ctx.save();ctx.translate(off,-off);ctx.beginPath();ctx.moveTo(0,-bh*0.5);ctx.lineTo(bw*0.42,bh*0.2);ctx.lineTo(0,bh*0.42);ctx.lineTo(-bw*0.42,bh*0.2);ctx.closePath();ctx.fill();ctx.restore();
        ctx.globalAlpha=0.35;ctx.save();ctx.translate(-off,off);ctx.beginPath();ctx.moveTo(0,-bh*0.5);ctx.lineTo(bw*0.42,bh*0.2);ctx.lineTo(0,bh*0.42);ctx.lineTo(-bw*0.42,bh*0.2);ctx.closePath();ctx.fill();ctx.restore();
        ctx.globalAlpha=1;ctx.shadowBlur=30;ctx.beginPath();ctx.moveTo(0,-bh*0.5);ctx.lineTo(bw*0.42,bh*0.2);ctx.lineTo(0,bh*0.42);ctx.lineTo(-bw*0.42,bh*0.2);ctx.closePath();ctx.fill();
        ctx.fillStyle='rgba(0,0,0,0.8)';ctx.beginPath();ctx.arc(0,0,bh*0.2,0,Math.PI*2);ctx.fill();
        ctx.shadowBlur=45;ctx.fillStyle=color;ctx.beginPath();ctx.arc(0,0,bh*0.1,0,Math.PI*2);ctx.fill();

    } else {
        // Fallback — original shape
        ctx.beginPath();
        ctx.moveTo(0,-bh*0.5); ctx.lineTo(bw*0.45,-bh*0.18); ctx.lineTo(bw*0.5,bh*0.22);
        ctx.lineTo(0,bh*0.5); ctx.lineTo(-bw*0.5,bh*0.22); ctx.lineTo(-bw*0.45,-bh*0.18);
        ctx.closePath(); ctx.fill();
        ctx.shadowBlur=16; ctx.shadowColor='#fff'; ctx.fillStyle='#fff';
        ctx.beginPath(); ctx.arc(0,bh*0.1,9,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
}

function drawPowerup(pu) {
    ctx.save(); ctx.translate(pu.x, pu.y); ctx.shadowBlur=16;
    if(pu.type === 'health') {
        ctx.shadowColor='#0f0'; ctx.fillStyle='#0f0';
        ctx.fillRect(-8,-3,16,6); ctx.fillRect(-3,-8,6,16);
    } else if(pu.type === 'rapid') {
        ctx.shadowColor='#ff0'; ctx.strokeStyle='#ff0'; ctx.lineWidth=3;
        ctx.beginPath(); ctx.moveTo(3,-10); ctx.lineTo(-3,0); ctx.lineTo(3,0); ctx.lineTo(-3,10); ctx.stroke();
    } else if(pu.type === 'laser') {
        ctx.shadowColor='#f8f'; ctx.strokeStyle='#f8f'; ctx.lineWidth=2.5;
        ctx.beginPath(); ctx.moveTo(0,-12); ctx.lineTo(0,12); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-5,-6); ctx.lineTo(5,-6); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-3,0); ctx.lineTo(3,0); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-5,6); ctx.lineTo(5,6); ctx.stroke();
    } else if(pu.type === 'nuke') {
        ctx.shadowColor='#f40'; ctx.fillStyle='#f40';
        ctx.beginPath(); ctx.arc(0,0,9,0,Math.PI*2); ctx.fill();
        ctx.shadowColor='#ff0'; ctx.fillStyle='#ff0';
        ctx.beginPath(); ctx.arc(0,0,4,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle='#f40'; ctx.lineWidth=1.5;
        for(let i=0;i<8;i++){const a=(i/8)*Math.PI*2;ctx.beginPath();ctx.moveTo(Math.cos(a)*9,Math.sin(a)*9);ctx.lineTo(Math.cos(a)*14,Math.sin(a)*14);ctx.stroke();}
    } else if(pu.type === 'overdrive') {
        ctx.shadowColor='#f80'; ctx.fillStyle='#f80';
        ctx.beginPath(); ctx.moveTo(0,-12); ctx.lineTo(6,0); ctx.lineTo(3,0); ctx.lineTo(3,12); ctx.lineTo(-3,12); ctx.lineTo(-3,0); ctx.lineTo(-6,0); ctx.closePath(); ctx.fill();
    } else if(pu.type === 'freeze') {
        ctx.shadowColor='#8ff'; ctx.strokeStyle='#8ff'; ctx.lineWidth=2;
        for(let i=0;i<6;i++){const a=(i/6)*Math.PI*2;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*11,Math.sin(a)*11);ctx.stroke();}
        ctx.fillStyle='#8ff'; ctx.beginPath(); ctx.arc(0,0,4,0,Math.PI*2); ctx.fill();
    } else if(pu.type === 'homing') {
        ctx.shadowColor='#f80'; ctx.fillStyle='#f80';
        ctx.beginPath(); ctx.moveTo(0,-12); ctx.lineTo(4,0); ctx.lineTo(0,-4); ctx.lineTo(-4,0); ctx.closePath(); ctx.fill();
    } else if(pu.type === 'timewarp') {
        ctx.shadowColor='#8ff'; ctx.strokeStyle='#8ff'; ctx.lineWidth=2;
        ctx.beginPath(); ctx.arc(0,0,10,0,Math.PI*2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0,-7); ctx.lineTo(0,0); ctx.lineTo(5,4); ctx.stroke();
    } else if(pu.type === 'magnet') {
        ctx.shadowColor='#f0f'; ctx.strokeStyle='#f0f'; ctx.lineWidth=3;
        ctx.beginPath(); ctx.arc(-4,0,6,-Math.PI,0); ctx.stroke();
        ctx.beginPath(); ctx.arc(4,0,6,-Math.PI,0); ctx.stroke();
    } else if(pu.type === 'ghost') {
        ctx.shadowColor='#aaf'; ctx.globalAlpha=0.5; ctx.fillStyle='#aaf';
        ctx.beginPath(); ctx.arc(0,-2,9,Math.PI,0); ctx.lineTo(9,10); ctx.lineTo(5,6); ctx.lineTo(0,10); ctx.lineTo(-5,6); ctx.lineTo(-9,10); ctx.closePath(); ctx.fill();
        ctx.globalAlpha=1;
    } else if(pu.type === 'mine') {
        ctx.shadowColor='#f40'; ctx.fillStyle='#f40';
        ctx.beginPath(); ctx.arc(0,0,8,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle='#ff0'; ctx.lineWidth=1.5;
        for(let i=0;i<6;i++){const a=(i/6)*Math.PI*2; ctx.beginPath(); ctx.moveTo(Math.cos(a)*8,Math.sin(a)*8); ctx.lineTo(Math.cos(a)*13,Math.sin(a)*13); ctx.stroke();}
    } else if(pu.type === 'scrap') {
        ctx.shadowColor='#ff0'; ctx.fillStyle='#ff0';
        ctx.font='bold 14px Courier New'; ctx.textAlign='center';
        ctx.fillText('$', 0, 5);
    } else if(pu.type==='dlc0_surge'||pu.type==='dlc0_link'||pu.type==='dlc0_aura') {
        const ci=['#80f','#a06','#c0f'][[' dlc0_surge','dlc0_link','dlc0_aura'].indexOf(pu.type)%3];
        ctx.shadowColor='#80f'; ctx.strokeStyle='#80f'; ctx.lineWidth=2;
        ctx.beginPath();ctx.moveTo(0,-12);ctx.lineTo(8,4);ctx.lineTo(0,0);ctx.lineTo(-8,4);ctx.closePath();ctx.stroke();
        ctx.fillStyle='#80f'; ctx.font='bold 9px Courier New'; ctx.textAlign='center';
        ctx.fillText(pu.type==='dlc0_surge'?'VS':pu.type==='dlc0_link'?'VL':'VA',0,4);
    } else if(pu.type==='dlc1_flare'||pu.type==='dlc1_fuel'||pu.type==='dlc1_nova') {
        ctx.shadowColor='#f80'; ctx.fillStyle='#f80';
        if(pu.type==='dlc1_flare'){ctx.beginPath();for(let i=0;i<8;i++){const a=(i/8)*Math.PI*2;ctx.moveTo(Math.cos(a)*5,Math.sin(a)*5);ctx.lineTo(Math.cos(a)*13,Math.sin(a)*13);}ctx.strokeStyle='#f80';ctx.lineWidth=2;ctx.stroke();ctx.beginPath();ctx.arc(0,0,5,0,Math.PI*2);ctx.fill();}
        else if(pu.type==='dlc1_fuel'){ctx.beginPath();ctx.moveTo(0,-12);ctx.lineTo(6,0);ctx.lineTo(3,0);ctx.lineTo(3,12);ctx.lineTo(-3,12);ctx.lineTo(-3,0);ctx.lineTo(-6,0);ctx.closePath();ctx.fill();}
        else{ctx.strokeStyle='#f80';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(0,0,11,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(0,0,5,0,Math.PI*2);ctx.fill();}
    } else if(pu.type==='dlc2_drift'||pu.type==='dlc2_warp'||pu.type==='dlc2_shield') {
        ctx.shadowColor='#0ff'; ctx.strokeStyle='#0ff'; ctx.lineWidth=2;
        if(pu.type==='dlc2_drift'){ctx.beginPath();ctx.arc(0,0,10,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(0,-12);ctx.lineTo(0,12);ctx.stroke();}
        else if(pu.type==='dlc2_warp'){ctx.beginPath();ctx.moveTo(-10,-10);ctx.bezierCurveTo(-10,-4,10,-4,10,-10);ctx.moveTo(-10,10);ctx.bezierCurveTo(-10,4,10,4,10,10);ctx.stroke();}
        else{ctx.strokeStyle='#0ff';ctx.lineWidth=2.5;for(let i=0;i<6;i++){const a=(i/6)*Math.PI*2;ctx.beginPath();ctx.moveTo(Math.cos(a)*5,Math.sin(a)*5);ctx.lineTo(Math.cos(a)*12,Math.sin(a)*12);ctx.stroke();}ctx.fillStyle='#0ff';ctx.beginPath();ctx.arc(0,0,5,0,Math.PI*2);ctx.fill();}
    } else if(pu.type==='dlc3_frenzy'||pu.type==='dlc3_blood'||pu.type==='dlc3_rage') {
        ctx.shadowColor='#f44'; ctx.fillStyle='#f44';
        if(pu.type==='dlc3_frenzy'){ctx.beginPath();ctx.moveTo(0,-13);ctx.lineTo(5,0);ctx.lineTo(-5,0);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(0,-5);ctx.lineTo(9,12);ctx.lineTo(-9,12);ctx.closePath();ctx.fill();}
        else if(pu.type==='dlc3_blood'){ctx.beginPath();ctx.arc(0,-2,9,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.moveTo(-4,5);ctx.lineTo(4,5);ctx.lineTo(0,13);ctx.closePath();ctx.fill();}
        else{ctx.strokeStyle='#f44';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(-11,-11);ctx.lineTo(11,11);ctx.moveTo(11,-11);ctx.lineTo(-11,11);ctx.stroke();ctx.beginPath();ctx.arc(0,0,5,0,Math.PI*2);ctx.fill();}
    } else if(pu.type==='dlc4_blizzard'||pu.type==='dlc4_armor'||pu.type==='dlc4_nova') {
        ctx.shadowColor='#8ff'; ctx.strokeStyle='#8ff'; ctx.lineWidth=2;
        if(pu.type==='dlc4_blizzard'){for(let i=0;i<6;i++){const a=(i/6)*Math.PI*2;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*12,Math.sin(a)*12);ctx.stroke();}ctx.fillStyle='#8ff';ctx.beginPath();ctx.arc(0,0,4,0,Math.PI*2);ctx.fill();}
        else if(pu.type==='dlc4_armor'){ctx.fillStyle='#8ff';ctx.beginPath();ctx.moveTo(-9,-12);ctx.lineTo(9,-12);ctx.lineTo(11,2);ctx.lineTo(0,13);ctx.lineTo(-11,2);ctx.closePath();ctx.fill();}
        else{ctx.beginPath();ctx.arc(0,0,11,0,Math.PI*2);ctx.stroke();for(let i=0;i<8;i++){const a=(i/8)*Math.PI*2;ctx.beginPath();ctx.moveTo(Math.cos(a)*11,Math.sin(a)*11);ctx.lineTo(Math.cos(a)*15,Math.sin(a)*15);ctx.stroke();}ctx.fillStyle='#8ff';ctx.beginPath();ctx.arc(0,0,4,0,Math.PI*2);ctx.fill();}
    } else if(pu.type==='dlc5_phase'||pu.type==='dlc5_rift'||pu.type==='dlc5_echo') {
        ctx.shadowColor='#0f8'; ctx.globalAlpha=0.7;
        if(pu.type==='dlc5_phase'){ctx.fillStyle='#0f8';ctx.beginPath();ctx.arc(0,-2,9,Math.PI,0);ctx.lineTo(9,10);ctx.lineTo(5,5);ctx.lineTo(0,10);ctx.lineTo(-5,5);ctx.lineTo(-9,10);ctx.closePath();ctx.fill();}
        else if(pu.type==='dlc5_rift'){ctx.strokeStyle='#0f8';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(-12,0);ctx.bezierCurveTo(-6,-10,6,-10,12,0);ctx.moveTo(-12,0);ctx.bezierCurveTo(-6,10,6,10,12,0);ctx.stroke();}
        else{ctx.strokeStyle='#0f8';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-11,-6);ctx.lineTo(-4,-6);ctx.lineTo(0,-11);ctx.lineTo(4,-6);ctx.lineTo(11,-6);ctx.moveTo(-11,6);ctx.lineTo(-4,6);ctx.lineTo(0,11);ctx.lineTo(4,6);ctx.lineTo(11,6);ctx.stroke();}
        ctx.globalAlpha=1;
    } else {
        ctx.shadowColor='#0ff'; ctx.strokeStyle='#0ff'; ctx.lineWidth=2.5;
        ctx.beginPath(); ctx.arc(0,0,10,0,Math.PI*2); ctx.stroke();
        ctx.beginPath(); ctx.arc(0,0,5,0,Math.PI*2); ctx.stroke();
    }
    ctx.restore();
}

function drawMuteButton() {
    ctx.save();
    ctx.shadowBlur = 8; ctx.shadowColor = soundMuted ? '#f44' : '#0ff';
    ctx.fillStyle = soundMuted ? '#f44' : '#0ff';
    ctx.font = '22px Courier New';
    ctx.textAlign = 'right';
    ctx.fillText(soundMuted ? '🔇' : '🔊', W-10, 40);
    ctx.restore();
}

function drawHUD() {
    ctx.shadowBlur=0; ctx.globalAlpha=1;
    drawMuteButton();
    if(player.hp === 1) {
        const pulse = 0.12 + 0.08*Math.sin(Date.now()*0.008);
        ctx.save(); ctx.globalAlpha=pulse; ctx.fillStyle='#f00';
        ctx.fillRect(0,0,W,H); ctx.restore(); ctx.globalAlpha=1;
    }
    ctx.font='22px Courier New';
    for(let i=0; i<player.maxHp; i++) {
        ctx.fillStyle = i < player.hp ? '#f44' : '#400';
        ctx.fillText('♥', 15+i*30, 36);
    }
    let buffX = 110;
    ctx.font='13px Courier New';
    if(player.shieldActive)    { ctx.fillStyle='#0ff'; ctx.fillText('SHIELD',buffX,36); buffX+=72; }
    if(player.rapidTimer > 0)  { ctx.fillStyle='#ff0'; ctx.fillText('RAPID:'+Math.ceil(player.rapidTimer/60)+'s', buffX,36); buffX+=78; }
    if(player.laserTimer > 0)  { ctx.fillStyle='#f8f'; ctx.fillText('LASER:'+Math.ceil(player.laserTimer/60)+'s', buffX,36); buffX+=78; }
    if(overdriveTimer > 0)     { ctx.fillStyle='#f80'; ctx.fillText('OVDRV:'+Math.ceil(overdriveTimer/60)+'s', buffX,36); buffX+=88; }
    if(freezeTimer > 0)        { ctx.fillStyle='#8ff'; ctx.fillText('FREEZE:'+Math.ceil(freezeTimer/60)+'s',buffX,36); buffX+=88; }
    if(ghostTimer > 0)         { ctx.fillStyle='#aaf'; ctx.fillText('GHOST:'+Math.ceil(ghostTimer/60)+'s', buffX,36); buffX+=82; }
    if(bonusScrapActive)       { ctx.fillStyle='#f0f'; ctx.fillText('x2⬡', buffX,36); buffX+=52; }
    if(dlcArmorHits > 0)       { ctx.fillStyle='#0ff'; ctx.fillText('▣'+dlcArmorHits, buffX,36); }
    ctx.fillStyle='#0ff'; ctx.font='18px Courier New'; ctx.textAlign='center';
    ctx.fillText('SCORE: '+score, W/2, 30);
    ctx.fillStyle='#888'; ctx.font='13px Courier New';
    if(endlessMode) {
        ctx.fillText('ENDLESS \u2014 WAVE '+(endlessWave+1), W/2, 48);
    } else {
        ctx.fillText('LVL '+(currentLevelIdx+1)+' \u2014 '+LEVELS[currentLevelIdx].name, W/2, 48);
    }
    ctx.textAlign='left';
    ctx.fillStyle='#ff0'; ctx.font='16px Courier New'; ctx.textAlign='right';
    ctx.fillText('\u2B21 '+scraps, W-15, 58);
    ctx.textAlign='left';
    if(rainbowMode && rainbowTimer > 0) {
        ctx.fillStyle='#f0f'; ctx.font='bold 12px Courier New'; ctx.textAlign='center';
        ctx.fillText('RAINBOW MODE: '+Math.ceil(rainbowTimer/60)+'s', W/2, 64);
        ctx.textAlign='left';
    }
    if(cornerInvincTimer > 0) {
        ctx.fillStyle='#0ff'; ctx.font='bold 12px Courier New'; ctx.textAlign='center';
        ctx.fillText('\u25CE INVINCIBLE: '+Math.ceil(cornerInvincTimer/60)+'s', W/2, 64);
        ctx.textAlign='left';
    }
    if(endlessMode) {
        ctx.fillStyle='#f0f'; ctx.font='16px Courier New'; ctx.textAlign='right';
        ctx.fillText('KILLS: '+killCount, W-15, 36);
        ctx.textAlign='left';
    } else if(LEVELS[currentLevelIdx].quota > 0) {
        ctx.fillStyle='#0f0'; ctx.font='16px Courier New'; ctx.textAlign='right';
        ctx.fillText('KILLS: '+killCount+'/'+LEVELS[currentLevelIdx].quota, W-15, 36);
        ctx.textAlign='left';
    }
}

}

function drawCustomizeScreen() {
    ctx.fillStyle='rgba(0,0,0,0.90)'; ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    ctx.shadowBlur=22; ctx.shadowColor='#ff0'; ctx.fillStyle='#ff0';
    ctx.font='bold 28px Courier New';
    ctx.fillText('\u2605  CUSTOMIZE YOUR SHIP  \u2605', W/2, H*0.10);
    ctx.shadowBlur=0; ctx.fillStyle='#888'; ctx.font='13px Courier New';
    ctx.fillText('Tap a section to cycle  \u2022  tap below to confirm', W/2, H*0.16);

    // Ship preview
    ctx.save();
    ctx.translate(W/2, H*0.27);
    ctx.scale(2.8, 2.8);
    drawPlayerShip(0, 0, SHIP_COLORS[shipConfig.color]);
    ctx.restore();

    // Owned counts per category
    const ownedHullCount   = ownedHulls.filter(Boolean).length;
    const ownedColorCount  = ownedColors.filter(Boolean).length;
    const ownedEngineCount = ownedEngines.filter(Boolean).length;

    const rowH = H*0.09;
    function drawRow(label, optName, rowY, col) {
        ctx.fillStyle = 'rgba(255,255,255,0.06)';
        ctx.fillRect(W*0.1, rowY - rowH*0.55, W*0.8, rowH);
        ctx.shadowBlur=8; ctx.shadowColor=col; ctx.fillStyle=col;
        ctx.font='17px Courier New';
        ctx.fillText(label + ':  \u25C4  ' + optName + '  \u25BA', W/2, rowY + 6);
        ctx.shadowBlur=0;
    }
    drawRow('HULL ('+ownedHullCount+'/'+ownedHulls.length+')',
            HULL_NAMES[shipConfig.hull],        H*0.40, '#0ff');
    drawRow('COLOR ('+ownedColorCount+'/'+ownedColors.length+')',
            SHIP_COLOR_NAMES[shipConfig.color], H*0.52, SHIP_COLORS[shipConfig.color]);
    drawRow('ENGINE ('+ownedEngineCount+'/'+ownedEngines.length+')',
            ENGINE_NAMES[shipConfig.engine],    H*0.64, ENGINE_COLORS[shipConfig.engine]);

    // Shop hint when locked items remain
    const hasLocked = ownedHullCount < ownedHulls.length ||
                      ownedColorCount < ownedColors.length ||
                      ownedEngineCount < ownedEngines.length;
    if(hasLocked) {
        ctx.fillStyle='#f80'; ctx.font='12px Courier New';
        ctx.fillText('\u2B21  MORE PARTS AVAILABLE IN THE SHOP  \u2B21', W/2, H*0.74);
    }

    ctx.shadowBlur=14; ctx.shadowColor='#0f0'; ctx.fillStyle='#0f0'; ctx.font='bold 16px Courier New';
    ctx.fillText('\u25B6  CONFIRM & CONTINUE  \u25C0', W/2, H*0.85); ctx.shadowBlur=0;
    ctx.textAlign='left'; ctx.shadowBlur=0;
}
function drawGuideScreen() {
    ctx.fillStyle='rgba(0,0,0,0.96)'; ctx.fillRect(0,0,W,H);

    // Fixed header
    ctx.textAlign='center';
    ctx.shadowBlur=22; ctx.shadowColor='#0ff'; ctx.fillStyle='#0ff';
    ctx.font='bold 26px Courier New';
    ctx.fillText('\u2139  ENEMY CODEX  \u2139', W/2, H*0.09);
    ctx.shadowBlur=0;

    // Scrollable content area
    const scrollTop = Math.round(H*0.12);
    const scrollBottom = H - 44;

    ctx.save();
    ctx.beginPath();
    ctx.rect(0, scrollTop, W, scrollBottom - scrollTop);
    ctx.clip();

    const enemies = [

        { name:'SNIPER',      color:'#f8f', size:24, hp:2,  draw:'sniper',      desc:'Long barrel. Very fast precision shots.',         threat:'MED' },

        { name:'NULLIFIER',   color:'#08f', size:36, hp:5,  draw:'nullifier',   desc:'Fires homing bullets that track your ship.',      threat:'EXTREME' },
        { name:'DREADNOUGHT', color:'#822', size:52, hp:12, draw:'dreadnought', desc:'Colossal. 5-way spread blasts. Massive HP.',      threat:'EXTREME' },
        { name:'ZIGZAG',      color:'#0f4', size:26, hp:3,  draw:'zigzag',      desc:'Weaves side-to-side. Fires aimed shots.',          threat:'MED' },
        { name:'BERSERKER',   color:'#f50', size:30, hp:5,  draw:'berserker',   desc:'Chases your ship. Speeds up when damaged.',        threat:'HIGH' },

        { name:'STEALTH',     color:'#8f8', size:28, hp:3,  draw:'stealth',     desc:'Phases in/out of visibility. Fires when visible.', threat:'HIGH' },
        { name:'REFLECTOR',   color:'#4ff', size:28, hp:3,  draw:'reflector',   desc:'Bounces off walls. Fires aimed shots from flanks.',threat:'MED' },
    ];
    const rowH = H * 0.075;
    enemies.forEach((e, i) => {
        const rowY = H*0.155 + i*rowH;
        const previewCX = W*0.14, previewCY = rowY + rowH*0.4;

        else if(e.draw==='phantom')  drawPhantomShip(previewCX-e.size/2, previewCY-e.size/2, e.size, e.color);
        else if(e.draw==='marauder') drawMarauderShip(previewCX-e.size/2, previewCY-e.size/2, e.size, e.color);
        else if(e.draw==='drone')    drawDroneShip(previewCX-e.size/2, previewCY-e.size/2, e.size, e.color);
        else if(e.draw==='gunship')  drawGunship(previewCX-e.size/2, previewCY-e.size/2, e.size, e.color);
        else if(e.draw==='interceptor') drawInterceptorShip(previewCX-e.size/2, previewCY-e.size/2, e.size, e.color);
        else if(e.draw==='bomber')   drawBomberShip(previewCX-e.size/2, previewCY-e.size/2, e.size, e.color);

        else if(e.draw==='dreadnought') drawDreadnoughtShip(previewCX-e.size/2, previewCY-e.size/2, e.size, e.color);
        else if(e.draw==='wraith')   drawWraithShip(previewCX-e.size/2, previewCY-e.size/2, e.size, e.color);
        else if(e.draw==='nullifier') drawNullifierShip(previewCX-e.size/2, previewCY-e.size/2, e.size, e.color);
        else if(e.draw==='zigzag')   drawZigzagShip(previewCX-e.size/2, previewCY-e.size/2, e.size, e.color);
        else if(e.draw==='berserker') drawBerserkerShip(previewCX-e.size/2, previewCY-e.size/2, e.size, e.color);
        else if(e.draw==='pulsar')    drawPulsarShip(previewCX-e.size/2, previewCY-e.size/2, e.size, e.color);

        else if(e.draw==='kamikaze')  drawKamikazeShip(previewCX-e.size/2, previewCY-e.size/2, e.size, e.color);
