        else if(e.draw==='reflector') drawReflectorShip(previewCX-e.size/2, previewCY-e.size/2, e.size, e.color);
        else                         drawEnemyShip(previewCX-e.size/2, previewCY-e.size/2, e.size, e.color);
        ctx.shadowBlur=8; ctx.shadowColor=e.color; ctx.fillStyle=e.color;
        ctx.font='bold 13px Courier New'; ctx.textAlign='left';
        ctx.fillText(e.name+'  \u2665 HP: '+e.hp+'  THREAT: '+e.threat, W*0.24, previewCY-3);
        ctx.shadowBlur=0; ctx.fillStyle='#aaa'; ctx.font='11px Courier New';
        ctx.fillText(e.desc, W*0.24, previewCY+13);
    });

    // Powerups (placed after all enemies)
    const divY = H*0.155 + enemies.length * rowH + H*0.02;
    ctx.textAlign='center';
    ctx.shadowBlur=10; ctx.shadowColor='#ff8'; ctx.fillStyle='#ff8';
    ctx.font='bold 13px Courier New';
    ctx.fillText('— POWERUPS —', W/2, divY);
    ctx.shadowBlur=0;
    const pups = [
        { sym:'\u2665', col:'#0f0', label:'HEALTH',    desc:'Restores 1 HP' },
        { sym:'\u26A1', col:'#ff0', label:'RAPID',     desc:'Triple rapid fire (10s)' },
        { sym:'\u25CE', col:'#0ff', label:'SHIELD',    desc:'Absorbs one hit' },
        { sym:'\u2606', col:'#f8f', label:'LASER',     desc:'Piercing beam (6s)' },
        { sym:'\u2739', col:'#f40', label:'NUKE',      desc:'Clears all enemies!' },
        { sym:'\u26A1', col:'#f80', label:'OVERDRIVE', desc:'Max fire rate (8s)' },
        { sym:'\u2744', col:'#8ff', label:'FREEZE',    desc:'Slows all enemies (3s)' },
    ];
    const pw = W / pups.length;
    pups.forEach((p, i) => {
        const px = pw*(i+0.5);
        ctx.shadowBlur=8; ctx.shadowColor=p.col; ctx.fillStyle=p.col;
        ctx.font='bold 13px Courier New';
        ctx.fillText(p.sym+' '+p.label, px, divY+20);
        ctx.shadowBlur=0; ctx.fillStyle='#888'; ctx.font='11px Courier New';
        ctx.fillText(p.desc, px, divY+35);
    });

    // Bosses
    const bossY = divY + 48;
    ctx.shadowBlur=10; ctx.shadowColor='#f0f'; ctx.fillStyle='#f0f';
    ctx.font='bold 13px Courier New';
    ctx.fillText('— BOSS ENCOUNTERS —', W/2, bossY);
    ctx.shadowBlur=0;
    const bossList = [
        {name:'GATEKEEPER',      lvl:3,  color:'#f0f'},
        {name:'IRON BASTION',    lvl:6,  color:'#f80'},
        {name:'DARK HERALD',     lvl:9,  color:'#a0f'},
        {name:'VOID HARBINGER',  lvl:12, color:'#0af'},
        {name:'THE OVERLORD',    lvl:13, color:'#f04'},
        {name:'PHANTOM KING',    lvl:16, color:'#0cf'},
        {name:'THE ANNIHILATOR', lvl:18, color:'#fff'},
        {name:'OMEGA SENTINEL',  lvl:21, color:'#5f0'},
        {name:'TITAN KING',      lvl:25, color:'#e22'},
        {name:'THE NULLIFIER',   lvl:29, color:'#08f'},
        {name:'VOID EMPEROR',    lvl:30, color:'#c0f'},
        {name:'THE SPECTRE',     lvl:33, color:'#adf'},
        {name:'THE UNDYING',     lvl:36, color:'#4fa'},
        {name:'THE ARCHITECT',   lvl:40, color:'#fa4'},
        {name:'THE REAPER',      lvl:44, color:'#f0a'},
        {name:'GENESIS PRIME',   lvl:48, color:'#fa0'},
        {name:'COSMIC DESTROYER',lvl:50, color:'#fff'},
    ];
    // Three-column layout so all bosses fit
    const colMid = W * 0.22, colMid2 = W * 0.55, colRight = W * 0.82;
    const perCol = 6;
    bossList.forEach((b, i) => {
        const col = i < perCol ? colMid : i < perCol*2 ? colMid2 : colRight;
        const row = i % perCol;
        ctx.shadowBlur=5; ctx.shadowColor=b.color; ctx.fillStyle=b.color;
        ctx.font='12px Courier New';
        ctx.fillText('LVL '+b.lvl+': '+b.name, col, bossY+16+row*17);
    });

    const contentBottom = bossY + 16 + perCol*17 + 20;
    ctx.restore();

    // Update max scroll based on content size
    guideMaxScroll = Math.max(0, contentBottom - scrollBottom);

    // Scrollbar
    if(guideMaxScroll > 0) {
        const sbX = W - 8, sbTrackTop = scrollTop + 4, sbTrackH = scrollBottom - scrollTop - 8;
        const thumbH = Math.max(30, sbTrackH * (scrollBottom - scrollTop) / (contentBottom - scrollTop));
        const thumbY = sbTrackTop + (guideScrollY / guideMaxScroll) * (sbTrackH - thumbH);
        ctx.fillStyle = 'rgba(255,255,255,0.12)';
        ctx.fillRect(sbX - 3, sbTrackTop, 6, sbTrackH);
        ctx.fillStyle = 'rgba(0,255,255,0.5)';
        ctx.fillRect(sbX - 3, thumbY, 6, thumbH);
    }

    // Fixed footer
    ctx.shadowBlur=0; ctx.fillStyle='#555'; ctx.font='14px Courier New';
    ctx.textAlign='center';
    ctx.fillText('\u25B6  TOUCH OR CLICK TO GO BACK  \u25C0', W/2, H-12);
    ctx.textAlign='left';
}

function drawShopScreen() {
    ctx.fillStyle='rgba(0,0,0,0.92)'; ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    ctx.shadowBlur=22; ctx.shadowColor='#ff0'; ctx.fillStyle='#ff0';
    ctx.font='bold 28px Courier New';
    ctx.fillText('\u2B21  SCRAP SHOP  \u2B21', W/2, H*0.12);
    ctx.shadowBlur=0;
    ctx.fillStyle='#0ff'; ctx.font='20px Courier New';
    ctx.fillText('SCRAPS: '+scraps, W/2, H*0.20);

    // Tab bar: UPGRADES | SHIP PARTS
    const tabY = H*0.245, tabH = H*0.065;
    ctx.fillStyle = shopTab==='upgrades' ? 'rgba(0,255,255,0.15)' : 'rgba(255,255,255,0.04)';
    ctx.fillRect(0, tabY, W/2, tabH);
    ctx.shadowBlur = shopTab==='upgrades' ? 10 : 0; ctx.shadowColor='#0ff';
    ctx.fillStyle = shopTab==='upgrades' ? '#0ff' : '#555';
    ctx.font='bold 14px Courier New';
    ctx.fillText('UPGRADES', W*0.25, tabY + tabH*0.65);
    ctx.fillStyle = shopTab==='parts' ? 'rgba(255,160,0,0.15)' : 'rgba(255,255,255,0.04)';
    ctx.fillRect(W/2, tabY, W/2, tabH);
    ctx.shadowBlur = shopTab==='parts' ? 10 : 0; ctx.shadowColor='#fa0';
    ctx.fillStyle = shopTab==='parts' ? '#fa0' : '#555';
    ctx.fillText('SHIP PARTS', W*0.75, tabY + tabH*0.65);
    ctx.shadowBlur=0;
    ctx.fillStyle='#333'; ctx.fillRect(0, tabY+tabH, W, 1);

    if(shopTab === 'upgrades') {
        const items = [
            { name:'REPAIR HULL',   desc:'Restore 1 HP',
              cost:15, col:'#0f0',  canBuy: scraps>=15 && player.hp<player.maxHp,
              note: player.hp>=player.maxHp ? '(FULL HP)' : '' },
            { name:'RAPID BOOST',   desc:'Fire rate +1  ('+upgrades.fireRate+'/2)',
              cost:30, col:'#ff0',  canBuy: scraps>=30 && upgrades.fireRate<2,
              note: upgrades.fireRate>=2 ? '(MAXED)' : '' },
            { name:'HULL PLATE',    desc:'+1 Max HP  ('+upgrades.maxHpBonus+'/2)',
              cost:50, col:'#0ff',  canBuy: scraps>=50 && upgrades.maxHpBonus<2,
              note: upgrades.maxHpBonus>=2 ? '(MAXED)' : '' },
            { name:'SHIELD CHARGE', desc:'Start next level with shield',
              cost:20, col:'#a0f',  canBuy: scraps>=20 && !upgrades.shieldOnStart,
              note: upgrades.shieldOnStart ? '(READY)' : '' },
            { name:'SPREAD SHOT',   desc:'Fire 3 bullets simultaneously',
              cost:50, col:'#f80',  canBuy: scraps>=50 && !spreadShotUpgrade,
              note: spreadShotUpgrade ? '(ACTIVE)' : '' },
            { name:'ARMOR PLATE',   desc:'Reduce damage taken (max 1)',
              cost:60, col:'#888',  canBuy: scraps>=60 && armorUpgrade<1,
              note: armorUpgrade>=1 ? '(MAXED)' : '' },
            { name:'PET DRONE',     desc:'Deploy an attack drone',
              cost:80, col:'#0f8',  canBuy: scraps>=80 && !droneActive,
              note: droneActive ? '(ACTIVE)' : '' },
            { name:'HEAL-ON-KILL',  desc:'Heal HP every 10/7/5 kills',
              cost:40, col:'#0f0',  canBuy: scraps>=40 && healOnKillUpgrade<3,
              note: healOnKillUpgrade>=3 ? '(MAXED)' : '('+healOnKillUpgrade+'/3)' },
            { name:'SCRAP BOOST',   desc:'+25% scrap per kill (max 2)',
              cost:35, col:'#ff0',  canBuy: scraps>=35 && scrapBonusUpgrade<2,
              note: scrapBonusUpgrade>=2 ? '(MAXED)' : '('+scrapBonusUpgrade+'/2)' },
        ];
        const rowH = H*0.072, r0 = H*0.33;
        items.forEach((item, i) => {
            const rowY = r0 + i*rowH;
            ctx.fillStyle = item.canBuy ? 'rgba(255,255,255,0.07)' : 'rgba(255,255,255,0.02)';
            ctx.fillRect(W*0.07, rowY, W*0.86, rowH*0.88);
            ctx.shadowBlur = item.canBuy ? 8 : 0; ctx.shadowColor = item.col;
            ctx.fillStyle = item.canBuy ? item.col : '#444';
            ctx.font='bold 15px Courier New'; ctx.textAlign='left';
            ctx.fillText(item.name, W*0.12, rowY+rowH*0.42);
            ctx.shadowBlur=0; ctx.fillStyle = item.canBuy ? '#aaa' : '#444';
            ctx.font='12px Courier New';
            ctx.fillText(item.desc, W*0.12, rowY+rowH*0.75);
            ctx.textAlign='right';
            ctx.shadowBlur = item.canBuy ? 8 : 0; ctx.shadowColor='#ff0';
            ctx.fillStyle = item.canBuy ? '#ff0' : '#443300';
            ctx.font='bold 16px Courier New';
            ctx.fillText('\u2B21 '+item.cost, W*0.88, rowY+rowH*0.42);
            if(item.note) {
                ctx.shadowBlur=0; ctx.fillStyle='#777'; ctx.font='12px Courier New';
                ctx.fillText(item.note, W*0.88, rowY+rowH*0.75);
            }
            ctx.textAlign='center';
        });
    } else {
        // PARTS sub-tab bar: HULLS | COLORS | ENGINES
        const stY = H*0.325, stH = H*0.06;
        const stTabs = ['HULLS','COLORS','ENGINES'];
        const tabW = W/3;
        stTabs.forEach((t, i) => {
            const active = partsSubTab === t.toLowerCase();
            ctx.fillStyle = active ? 'rgba(255,200,0,0.18)' : 'rgba(255,255,255,0.04)';
            ctx.fillRect(i*tabW, stY, tabW, stH);
            ctx.shadowBlur = active ? 8 : 0; ctx.shadowColor='#ff8';
            ctx.fillStyle = active ? '#ff8' : '#555';
            ctx.font='bold 13px Courier New';
            ctx.fillText(t, i*tabW + tabW/2, stY + stH*0.67);
        });
        ctx.shadowBlur=0;
        ctx.fillStyle='#333'; ctx.fillRect(0, stY+stH, W, 1);

        const itemH = H*0.072, itemStart = H*0.395;

        if(partsSubTab === 'hulls') {
            const shopIdxs = HULL_PRICES.map((_,i)=>i).filter(i=>HULL_PRICES[i]>0);
            shopIdxs.forEach((hi, row) => {
                const rowY = itemStart + row*itemH;
                const owned = ownedHulls[hi];
                const affordable = !owned && scraps >= HULL_PRICES[hi];
                ctx.fillStyle = owned ? 'rgba(0,255,100,0.08)' : affordable ? 'rgba(255,255,255,0.06)' : 'rgba(255,255,255,0.02)';
                ctx.fillRect(W*0.05, rowY, W*0.9, itemH*0.9);
                ctx.save();
                ctx.translate(W*0.13, rowY + itemH*0.45);
                ctx.scale(1.4, 1.4);
                const savedHull = shipConfig.hull;
                shipConfig.hull = hi;
                drawPlayerShip(0, 0, owned ? SHIP_COLORS[shipConfig.color] : '#555');
                shipConfig.hull = savedHull;
                ctx.restore();
                ctx.shadowBlur = owned ? 6 : affordable ? 4 : 0;
                ctx.shadowColor = owned ? '#0f4' : '#0ff';
                ctx.fillStyle = owned ? '#0f4' : affordable ? '#0ff' : '#444';
                ctx.font='bold 13px Courier New'; ctx.textAlign='left';
                ctx.fillText(HULL_NAMES[hi], W*0.22, rowY + itemH*0.55);
                ctx.shadowBlur=0; ctx.textAlign='right';
                if(owned) {
                    ctx.fillStyle='#0f4'; ctx.font='bold 12px Courier New';
                    ctx.fillText('OWNED', W*0.93, rowY + itemH*0.55);
                } else {
                    ctx.shadowBlur = affordable ? 8 : 0; ctx.shadowColor='#ff0';
                    ctx.fillStyle = affordable ? '#ff0' : '#443300';
                    ctx.font='bold 14px Courier New';
                    ctx.fillText('\u2B21 '+HULL_PRICES[hi], W*0.93, rowY + itemH*0.55);
                    ctx.shadowBlur=0;
                    if(!affordable) {
                        ctx.fillStyle='#444'; ctx.font='10px Courier New';
                        ctx.fillText('NEED '+(HULL_PRICES[hi]-scraps)+' MORE', W*0.93, rowY + itemH*0.82);
                    }
                }
                ctx.textAlign='center';
            });
        } else if(partsSubTab === 'colors') {
            const shopIdxs = COLOR_PRICES.map((_,i)=>i).filter(i=>COLOR_PRICES[i]>0);
            shopIdxs.forEach((ci, row) => {
                const rowY = itemStart + row*itemH;
                const owned = ownedColors[ci];
                const affordable = !owned && scraps >= COLOR_PRICES[ci];
                ctx.fillStyle = owned ? 'rgba(0,255,100,0.08)' : affordable ? 'rgba(255,255,255,0.06)' : 'rgba(255,255,255,0.02)';
                ctx.fillRect(W*0.05, rowY, W*0.9, itemH*0.9);
                ctx.shadowBlur = 10; ctx.shadowColor = SHIP_COLORS[ci];
                ctx.fillStyle = owned ? SHIP_COLORS[ci] : '#222';
                ctx.fillRect(W*0.08, rowY + itemH*0.15, W*0.1, itemH*0.65);
                ctx.strokeStyle = SHIP_COLORS[ci]; ctx.lineWidth=1.5;
                ctx.strokeRect(W*0.08, rowY + itemH*0.15, W*0.1, itemH*0.65);
                ctx.shadowBlur=0;
                ctx.fillStyle = owned ? SHIP_COLORS[ci] : affordable ? '#aaa' : '#444';
                ctx.font='bold 13px Courier New'; ctx.textAlign='left';
                ctx.fillText(SHIP_COLOR_NAMES[ci], W*0.22, rowY + itemH*0.55);
                ctx.textAlign='right';
                if(owned) {
                    ctx.fillStyle='#0f4'; ctx.font='bold 12px Courier New';
                    ctx.fillText('OWNED', W*0.93, rowY + itemH*0.55);
                } else {
                    ctx.shadowBlur = affordable ? 8 : 0; ctx.shadowColor='#ff0';
                    ctx.fillStyle = affordable ? '#ff0' : '#443300';
                    ctx.font='bold 14px Courier New';
                    ctx.fillText('\u2B21 '+COLOR_PRICES[ci], W*0.93, rowY + itemH*0.55);
                    ctx.shadowBlur=0;
                    if(!affordable) {
                        ctx.fillStyle='#444'; ctx.font='10px Courier New';
                        ctx.fillText('NEED '+(COLOR_PRICES[ci]-scraps)+' MORE', W*0.93, rowY + itemH*0.82);
                    }
                }
                ctx.textAlign='center';
            });
        } else {
            const shopIdxs = ENGINE_PRICES.map((_,i)=>i).filter(i=>ENGINE_PRICES[i]>0);
            shopIdxs.forEach((ei, row) => {
                const rowY = itemStart + row*itemH;
                const owned = ownedEngines[ei];
                const affordable = !owned && scraps >= ENGINE_PRICES[ei];
                ctx.fillStyle = owned ? 'rgba(0,255,100,0.08)' : affordable ? 'rgba(255,255,255,0.06)' : 'rgba(255,255,255,0.02)';
                ctx.fillRect(W*0.05, rowY, W*0.9, itemH*0.9);
                ctx.shadowBlur = 10; ctx.shadowColor = ENGINE_COLORS[ei];
                ctx.fillStyle = owned ? ENGINE_COLORS[ei] : '#222';
                ctx.beginPath(); ctx.arc(W*0.13, rowY + itemH*0.45, itemH*0.28, 0, Math.PI*2); ctx.fill();
                ctx.strokeStyle = ENGINE_COLORS[ei]; ctx.lineWidth=1.5;
                ctx.beginPath(); ctx.arc(W*0.13, rowY + itemH*0.45, itemH*0.28, 0, Math.PI*2); ctx.stroke();
                ctx.shadowBlur=0;
                ctx.fillStyle = owned ? ENGINE_COLORS[ei] : affordable ? '#aaa' : '#444';
                ctx.font='bold 13px Courier New'; ctx.textAlign='left';
                ctx.fillText(ENGINE_NAMES[ei], W*0.22, rowY + itemH*0.55);
                ctx.textAlign='right';
                if(owned) {
                    ctx.fillStyle='#0f4'; ctx.font='bold 12px Courier New';
                    ctx.fillText('OWNED', W*0.93, rowY + itemH*0.55);
                } else {
                    ctx.shadowBlur = affordable ? 8 : 0; ctx.shadowColor='#ff0';
                    ctx.fillStyle = affordable ? '#ff0' : '#443300';
                    ctx.font='bold 14px Courier New';
                    ctx.fillText('\u2B21 '+ENGINE_PRICES[ei], W*0.93, rowY + itemH*0.55);
                    ctx.shadowBlur=0;
                    if(!affordable) {
                        ctx.fillStyle='#444'; ctx.font='10px Courier New';
                        ctx.fillText('NEED '+(ENGINE_PRICES[ei]-scraps)+' MORE', W*0.93, rowY + itemH*0.82);
                    }
                }
                ctx.textAlign='center';
            });
        }
    }

    ctx.shadowBlur=12; ctx.shadowColor='#0ff'; ctx.fillStyle='#0ff';
    ctx.font='bold 16px Courier New';
    ctx.fillText('\u25B6  LEAVE SHOP  \u25C0', W/2, H*0.93);
    ctx.shadowBlur=0; ctx.textAlign='left';
}
// ================================================================
// MAIN LOOP
// ================================================================
function loop() {
    const lvl = LEVELS[Math.min(currentLevelIdx, LEVELS.length-1)];
    ctx.fillStyle = lvl.bgTint || 'rgba(0,0,0,0.38)'; ctx.fillRect(0,0,W,H);

    // Starfield (slower on non-playing screens)
    ctx.shadowBlur=0;
    const sSpeed = (gameState==='playing') ? 1 : 0.25;
    if(gameState==='playing' && !endlessMode) {
        if(dlcMode && activeDlc !== null) { starZoneColor = DLC_DATA[activeDlc].color; }
        else if(LEVELS[currentLevelIdx]) { starZoneColor = LEVELS[currentLevelIdx].starColor || '#adf'; }
    }
    for(let s of stars) {
        s.y += s.speed * sSpeed;
        if(s.y > H) { s.y=0; s.x=Math.random()*W; }
        ctx.globalAlpha=s.alpha; ctx.fillStyle=gameState==='playing' ? starZoneColor : s.color;
        ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;

    // Nebulae
    for(let n of nebulae) {
        n.x+=n.vx; n.y+=n.vy;
        if(n.x<-n.r) n.x=W+n.r; if(n.x>W+n.r) n.x=-n.r;
        if(n.y<-n.r) n.y=H+n.r; if(n.y>H+n.r) n.y=-n.r;
        ctx.save();
        ctx.globalAlpha=n.alpha;
        ctx.shadowBlur=n.r*0.4; ctx.shadowColor=n.color;
        ctx.fillStyle=n.color;
        ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,Math.PI*2); ctx.fill();
        ctx.restore();
    }
    ctx.globalAlpha=1;

    // --- NON-PLAYING SCREENS ---
    if(gameState === 'title') {
        const hsLine = highScore > 0 ? 'BEST SCORE: '+highScore : '';
        const subtitles = ['SURVIVE THE VOID','FIGHT TO THE END','LEGENDS NEVER DIE','THE GALAXY NEEDS YOU','BLAST THROUGH THE DARK','NO MERCY, NO RETREAT','ARE YOU THE CHOSEN ONE?','DEFEND OR BE DESTROYED'];
        const subLine = subtitles[Math.floor(Date.now()/4000)%subtitles.length];
        drawOverlay('NEON SHOOTER', '#0ff',
            ['— '+subLine+' —', '',
             '150 LEVELS  ·  77+ ENEMY TYPES  ·  34+ BOSSES',
             'TRAVERSE NEBULAE, ASTEROID FIELDS',
             'AND FACE THE ETERNAL',
             '', hsLine],
            '\u25B6  TOUCH OR CLICK TO START  \u25C0');
        drawMuteButton();
        ctx.textAlign='center';
        ctx.shadowBlur=14; ctx.shadowColor='#ff8'; ctx.fillStyle='#ff8';
        ctx.font='bold 16px Courier New';
        ctx.fillText('\u2139  ENEMY GUIDE  \u2139', W/2, H*0.84);
        ctx.shadowBlur=14; ctx.shadowColor='#f0f'; ctx.fillStyle='#f0f';
        ctx.font='bold 16px Courier New';
        ctx.fillText('\u221e  ENDLESS MODE  \u221e', W/2, H*0.74);
        ctx.shadowBlur=14; ctx.shadowColor='#0f8'; ctx.fillStyle='#0f8';
        ctx.font='bold 16px Courier New';
        ctx.fillText('✴  DLC CAMPAIGNS  ✴', W/2, H*0.63);
        ctx.shadowBlur=0; ctx.fillStyle='#444'; ctx.font='12px Courier New';
        ctx.fillText('MOVE: MOUSE / TOUCH  ·  SHOOT: AUTOMATIC', W/2, H*0.955);
        ctx.shadowBlur=0; ctx.textAlign='left';
        requestAnimationFrame(loop); return;
    }
    if(gameState === 'dlcSelect') {
        drawDlcSelectScreen();
        requestAnimationFrame(loop); return;
    }
    if(gameState === 'dlcVictory') {
        const dlcName = activeDlc !== null ? DLC_DATA[activeDlc].name : 'DLC';
        drawOverlay(dlcName + ' DLC COMPLETE!', '#0f0',
            ['You have conquered this campaign!', '', 'FINAL SCORE: '+score, '\u2B21 SCRAPS: '+scraps, '', 'Brave pilot, the cosmos salutes you.'],
            '\u25B6  TOUCH OR CLICK TO RETURN  \u25C0');
        requestAnimationFrame(loop); return;
    }
    if(gameState === 'paused') {
        ctx.fillStyle='rgba(0,0,0,0.70)'; ctx.fillRect(0,0,W,H);
        ctx.textAlign='center';
        ctx.shadowBlur=22; ctx.shadowColor='#0ff'; ctx.fillStyle='#0ff';
        ctx.font='bold 40px Courier New';
        ctx.fillText('PAUSED', W/2, H*0.38);
        ctx.shadowBlur=0; ctx.fillStyle='#888'; ctx.font='16px Courier New';
        ctx.fillText('PRESS ESC / P  OR  CLICK TO RESUME', W/2, H*0.52);
        ctx.fillStyle='#555'; ctx.font='13px Courier New';
        ctx.fillText('SCORE: '+score+'   ⬡ SCRAPS: '+scraps, W/2, H*0.62);
        ctx.fillStyle='#444'; ctx.font='12px Courier New';
        ctx.fillText('MOVE: MOUSE / TOUCH  ·  SHOOT: AUTOMATIC  ·  NUKE: CLICK (when active)', W/2, H*0.72);
        ctx.textAlign='left';
        requestAnimationFrame(loop); return;
    }
    if(gameState === 'guide') {
        drawGuideScreen();
        requestAnimationFrame(loop); return;
    }
    if(gameState === 'intro') {
        drawOverlay('LEVEL '+(currentLevelIdx+1), '#ff0',
            [lvl.name, '', ...lvl.story],
            '\u25B6  TOUCH OR CLICK TO BEGIN  \u25C0');
        requestAnimationFrame(loop); return;
    }
    if(gameState === 'bossLore') {
        drawBossLoreScreen();
        requestAnimationFrame(loop); return;
    }
    if(gameState === 'levelComplete') {
        let rating = 'C', ratingColor='#888';
        const hpRatio = player.hp / player.maxHp;
        if(levelDamageReceived===0 && hpRatio>=1) { rating='S'; ratingColor='#ff0'; }
        else if(levelDamageReceived<=1 && hpRatio>0.5) { rating='A'; ratingColor='#0ff'; }
        else if(levelDamageReceived<=3 && hpRatio>0.3) { rating='B'; ratingColor='#0f0'; }
        const flavors=['Outstanding!','Well done!','Keep it up!','Impressive!','Excellent run!','Solid work!','Unstoppable!','Push forward!'];
        const flv=flavors[(flavorIdx++)%flavors.length];
        drawOverlay('LEVEL COMPLETE', '#0f0',
            [lvl.name, '',
             'ENEMIES DEFEATED: '+killCount,
             'LEVEL BONUS: +'+levelBonus,
             'TOTAL SCORE: '+score,
             '\u2B21 SCRAPS: '+scraps,
             flv],
            '\u25B6  TOUCH OR CLICK TO CONTINUE  \u25C0',
            customizationUnlocked ? '\u2605  CUSTOMIZE SHIP  \u2605' : null);
        ctx.textAlign='center';
        ctx.shadowBlur=14; ctx.shadowColor='#ff0'; ctx.fillStyle='#ff0';
        ctx.font='bold 16px Courier New';
        ctx.fillText('\u2B21  VISIT SCRAP SHOP  \u2B21', W/2, H*0.84);
        ctx.shadowBlur=20; ctx.shadowColor=ratingColor; ctx.fillStyle=ratingColor;
        ctx.font='bold 40px Courier New'; ctx.textAlign='right';
        ctx.fillText(rating, W-30, H*0.34);
        ctx.shadowBlur=0;
        ctx.fillStyle='#666'; ctx.font='11px Courier New'; ctx.textAlign='right';
        ctx.fillText('S = no hits', W-8, H*0.38);
        ctx.fillText('A = ≤1 hit, >50% HP', W-8, H*0.42);
        ctx.fillText('B = ≤3 hits', W-8, H*0.46);
        ctx.fillText('C = survived', W-8, H*0.50);
        ctx.textAlign='left';
        requestAnimationFrame(loop); return;
    }
    if(gameState === 'shop') {
        drawShopScreen();
        requestAnimationFrame(loop); return;
    }
    if(gameState === 'customize') {
        drawCustomizeScreen();
        requestAnimationFrame(loop); return;
    }
    if(gameState === 'gameover') {
        const goTitle = endlessMode ? 'WAVE ENDED' : 'SHIP DESTROYED';
        const goLines = endlessMode
            ? ['ENDLESS WAVE: '+(endlessWave+1), '', 'SCORE: '+score, 'TOTAL KILLS: '+killCount, '']
            : (dlcMode ? ['DLC: '+DLC_DATA[activeDlc].name, 'LEVEL '+(dlcLevelIdx+1), '', 'SCORE: '+score, 'KILLS: '+killCount] : ['LEVEL '+(currentLevelIdx+1)+': '+lvl.name, '', 'SCORE: '+score, 'KILLS THIS RUN: '+killCount, '', 'Progress saves — retry from this level.']);
        const goBtn = endlessMode ? '\u25B6  RETRY ENDLESS  \u25C0' : '\u25B6  TOUCH OR CLICK TO RETRY  \u25C0';
        drawOverlay(goTitle, '#f44', goLines, goBtn);
        ctx.textAlign='center';
        ctx.shadowBlur=14; ctx.shadowColor='#0af'; ctx.fillStyle='#0af';
        ctx.font='bold 16px Courier New';
        ctx.fillText('\u2302  MAIN MENU  \u2302', W/2, H*0.84);
        ctx.shadowBlur=0; ctx.textAlign='left';
        requestAnimationFrame(loop); return;
    }
    if(gameState === 'victory') {
        drawOverlay('MISSION COMPLETE', '#ff0',
            ['THE COSMIC DESTROYER IS ANNIHILATED.', 'THE GALAXY IS SAVED. YOUR LEGEND IS ETERNAL.', '',
             'FINAL SCORE: '+score, 'ALL 150 LEVELS CLEARED!'],
            '\u25B6  TOUCH OR CLICK TO PLAY AGAIN  \u25C0');
        requestAnimationFrame(loop); return;
    }

    // --- PLAYING ---

    // Screen shake
    let shakeApplied = false;
    if(screenShake > 0) {
        ctx.save();
        ctx.translate((Math.random()-0.5)*screenShake*1.5, (Math.random()-0.5)*screenShake*1.5);
        screenShake = Math.max(0, screenShake - 1.5);
        shakeApplied = true;
    }

    // Level intro warp effect
    if(levelIntroTimer > 0) {
        const prog = levelIntroTimer / 120;
        if(levelIntroTimer > 100) {
            ctx.save(); ctx.globalAlpha = prog * 0.7;
            for(let i=0;i<30;i++) {
                const wl = Math.random()*W;
                const wlen = Math.random()*150+50;
                ctx.strokeStyle='#0ff'; ctx.lineWidth=1.5;
                ctx.beginPath(); ctx.moveTo(wl,0); ctx.lineTo(wl,wlen); ctx.stroke();
            }
            ctx.restore();
        }
        const lvlName = endlessMode ? 'ENDLESS WAVE '+(endlessWave+1) :
            'LEVEL '+(currentLevelIdx+1)+' -- '+(LEVELS[currentLevelIdx]?LEVELS[currentLevelIdx].name:'');
        ctx.save(); ctx.globalAlpha = Math.min(1, prog*3);
        ctx.shadowBlur=22; ctx.shadowColor='#0ff'; ctx.fillStyle='#0ff';
        ctx.font='bold 28px Courier New'; ctx.textAlign='center';
        ctx.fillText(lvlName, W/2, H*0.38);
        ctx.restore(); ctx.textAlign='left';
    }
    // Particles
    for(let i=particles.length-1; i>=0; i--) {
        const pt=particles[i];
        pt.x+=pt.vx; pt.y+=pt.vy; pt.vy+=0.06; pt.life-=pt.decay;
        if(pt.life<=0) { particles.splice(i,1); continue; }
        ctx.globalAlpha=pt.life; ctx.shadowBlur=5; ctx.shadowColor=pt.color; ctx.fillStyle=pt.color;
        ctx.beginPath(); ctx.arc(pt.x,pt.y,pt.r,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1; ctx.shadowBlur=0;

    // Player
    if(player.invincFrames > 0) player.invincFrames--;
    if(player.rapidTimer > 0) player.rapidTimer--;
    if(player.laserTimer > 0) player.laserTimer--;
    if(comboTimer > 0) comboTimer--;
    const showPlayer = player.invincFrames===0 || Math.floor(player.invincFrames/5)%2===0;
    if(showPlayer) {
        if(player.shieldActive) {
            ctx.save(); ctx.shadowBlur=20; ctx.shadowColor='#0ff';
            ctx.strokeStyle='rgba(0,255,255,0.7)'; ctx.lineWidth=2.5;
            ctx.beginPath(); ctx.arc(player.x+12,player.y+12,24,0,Math.PI*2); ctx.stroke();
            ctx.restore();
        }
        drawPlayerShip(player.x+12, player.y+12, player.rapidTimer>0 ? '#ff8' : SHIP_COLORS[shipConfig.color]);
    }
    // Draw allies
    if(dlcMode) { for(const ally of allies) drawAlly(ally); }
    // Engine trail
    if(showPlayer) {
        const engCol = ENGINE_COLORS[shipConfig.engine];
        if(Math.random() < 0.75) {
            particles.push({ x:player.x+12+(Math.random()-0.5)*5, y:player.y+26,
                vx:(Math.random()-0.5)*0.6, vy:Math.random()*2.5+0.8,
                life:0.65, decay:0.07, r:Math.random()*2.2+0.5, color:engCol });
        }
    }
    ctx.shadowBlur=0;

    // Laser beam
    if(player.laserTimer > 0 && showPlayer) {
        const lx = player.x+12;
        ctx.save();
        const alpha = Math.min(1, player.laserTimer/15);
        ctx.globalAlpha = alpha * 0.9;
        ctx.shadowBlur=18; ctx.shadowColor='#f8f'; ctx.strokeStyle='#fff'; ctx.lineWidth=3;
        ctx.beginPath(); ctx.moveTo(lx, player.y); ctx.lineTo(lx, 0); ctx.stroke();
        ctx.shadowBlur=28; ctx.shadowColor='#f0f'; ctx.strokeStyle='#f8f'; ctx.lineWidth=7;
        ctx.globalAlpha = alpha * 0.4;
        ctx.beginPath(); ctx.moveTo(lx, player.y); ctx.lineTo(lx, 0); ctx.stroke();
        ctx.restore();
        // Laser hits enemies (sound throttled: play only every 8 frames)
        if(player.laserTimer % 8 === 0) playSound('laser');
        for(let bi=bots.length-1; bi>=0; bi--) {
            const bot=bots[bi];
            if(Math.abs((bot.x+bot.size/2)-lx) < 8) {
                bot.hp -= 0.3;
                spawnParticles(bot.x+bot.size/2, bot.y+bot.size*0.5, '#f8f', 2);
                if(bot.hp<=0) {
                    spawnParticles(bot.x+bot.size/2,bot.y+bot.size/2,bot.color,14);
                    playSound('enemyDie');
                    maybeDropPowerup(bot.x+bot.size/2,bot.y+bot.size/2);
                    const sc2=bot.type==='titan'?6:bot.type==='dreadnought'?8:bot.type==='vanguard'?5:bot.type==='heavy'?4:3;
                    scraps+=bonusScrapActive?sc2*2:sc2;
                    score+=3;
                    if(bot.type==='splitter') {
                        for(let si=0;si<2;si++) bots.push({x:bot.x+(si-0.5)*bot.size,y:bot.y,v:4.0+currentLevelIdx*0.35,hp:1,maxHp:1,color:'#fa4',size:16,type:'drone',drift:(Math.random()-0.5)*2.2,shootTimer:0,flashTimer:0});
                    }
                    if(bot.dlcSplit){for(let si=0;si<2;si++)bots.push({x:bot.x+(si-.5)*bot.size,y:bot.y,v:3.5,hp:1,maxHp:1,color:bot.color,size:14,type:'drone',drift:(Math.random()-.5)*2.5,shootTimer:0,flashTimer:0});}
                    if(bot.dlcFreezeOnDie){freezeTimer=Math.max(freezeTimer,120);floatingTexts.push({x:bot.x+bot.size/2,y:bot.y,text:'FREEZE!',color:'#8ff',life:1.0,decay:0.025,vy:-1.5});}
                    if(bot.dlcRadialOnDie){for(let ri=0;ri<8;ri++){const ra=(ri/8)*Math.PI*2;bullets.push({x:bot.x+bot.size/2,y:bot.y+bot.size/2,v:Math.sin(ra)*3.5,vx:Math.cos(ra)*3.5,enemy:true,width:4});}}
                    bots.splice(bi,1);
                    killCount++; checkLevelComplete();
                }
            }
        }
        if(boss && Math.abs((boss.x+60)-lx)<55) {
            boss.hp-=0.18;
            if(boss.hp<=0) {
                spawnParticles(boss.x+60,boss.y+45,boss.color,55); playSound('bossDie');
                const bsc=20+currentLevelIdx*3; scraps+=bsc;
                floatingTexts.push({x:boss.x+60,y:boss.y+45,text:'+'+bsc+'\u2B21',color:'#ff0',life:1.2,decay:0.016,vy:-1.5});
                score+=100+currentLevelIdx*20;
                if(boss.shape && !bossHullShapes.includes(boss.shape)) {
                    bossHullShapes.push(boss.shape); bossHullNames.push(boss.name||'BOSS'); bossHullColors.push(boss.color);
                    ownedHulls.push(true);
                    floatingTexts.push({x:W/2,y:H*0.42,text:'\u2605 HULL UNLOCKED: '+(boss.name||'BOSS'),color:'#f0f',life:2.5,decay:0.006,vy:-0.4});
                }
                if(endlessMode) {
                    boss=null; bossKilledThisLevel=true;
                } else {
                    const lvlDef=dlcMode ? DLC_DATA[activeDlc].levels[dlcLevelIdx] : LEVELS[currentLevelIdx];
                    bossLoreHeadline=lvlDef.boss.name+' DESTROYED';
                    bossLoreLines=lvlDef.bossLore||['The enemy falls. Move forward.'];
                    boss=null; bossKilledThisLevel=true;
                    gameState='bossLore';
                }
            } else {
                spawnParticles(boss.x+60, boss.y+45, boss.color, 2);
            }
        }
    }

    // Auto-fire
    fireTimer++;
    // Base cadence: 6 frames (no upgrade), 5 (lv1), 4 (lv2); rapid overrides to 2
    if(fireTimer >= (player.rapidTimer>0 ? 2 : overdriveTimer>0 ? 1 : Math.max(3, 6-upgrades.fireRate))) {
        fireTimer=0;
        const isCrit = Math.random() < critChance;
        const bColor = overdriveTimer>0 ? '#f80' : player.rapidTimer>0 ? '#ff0' : '#0ff';
        bullets.push({x:player.x+10, y:player.y-2, v:-18, enemy:false, width: isCrit?6:4, crit:isCrit, bColor:bColor});
        if(isCrit) floatingTexts.push({x:player.x+12,y:player.y-10,text:'CRIT!',color:'#ff0',life:0.9,decay:0.03,vy:-2.0});
        playSound('shoot');
        if(player.rapidTimer > 0) {
            bullets.push({x:player.x-2,  y:player.y+8, v:-16, vx:-1.8, enemy:false, width:3, bColor:bColor});
            bullets.push({x:player.x+22, y:player.y+8, v:-16, vx: 1.8, enemy:false, width:3, bColor:bColor});
        }
        if(spreadShotUpgrade) {
            bullets.push({x:player.x+10, y:player.y-2, v:-17, vx:-2.5, enemy:false, width:3, bColor:bColor});
            bullets.push({x:player.x+10, y:player.y-2, v:-17, vx: 2.5, enemy:false, width:3, bColor:bColor});
        }
    }

    // Boss warning klaxon
    if(boss !== null && prevBoss === null && !bossWarningShown) {
        bossWarningShown = true;
        floatingTexts.push({x:W/2,y:H*0.35,text:'!!! BOSS INCOMING !!!',color:'#f00',life:3.0,decay:0.005,vy:-0.2});
        playSound('bossDie');
    }
    if(boss === null) { bossWarningShown = false; }
    prevBoss = boss;
    // Boss
    if(boss) {
        boss.x += boss.dir;
        if(boss.x < 0 || boss.x > W-120) boss.dir *= -1;
        drawBossShip(boss.x, boss.y, 120, 90, boss.color, boss.shape);
        ctx.shadowBlur=0;
        // Boss name + HP bar
        ctx.shadowBlur=8; ctx.shadowColor=boss.color;
        ctx.fillStyle=boss.color; ctx.font='bold 14px Courier New'; ctx.textAlign='center';
        ctx.fillText('▼ '+boss.name+' ▼', W/2, 14);
        ctx.shadowBlur=0; ctx.textAlign='left';
        ctx.fillStyle='#300'; ctx.fillRect(W*0.15,18,W*0.7,12);
        ctx.fillStyle='#f00'; ctx.fillRect(W*0.15,18,(boss.hp/boss.maxHp)*W*0.7,12);
        // Boss enrage at 25% HP
        if(!bossEnraged && boss.hp <= boss.maxHp * 0.25) {
            bossEnraged = true;
            floatingTexts.push({x:W/2,y:H*0.4,text:'! BOSS ENRAGED !',color:'#f00',life:2.0,decay:0.01,vy:-0.5});
            playSound('bossHit');
        }
        // Boss fires spread shots aimed at player
        boss.shootTimer++;
        const bossFireRate = bossEnraged ? Math.max(10, Math.floor(boss.fireRate*0.5)) : boss.fireRate;
        if(boss.shootTimer >= bossFireRate) {
            boss.shootTimer=0;
            const sp = bossEnraged ? (boss.spread||1)+2 : (boss.spread || 1);
            for(let si=0; si<sp; si++) {
                const baseA = Math.atan2(player.y+12-(boss.y+80), player.x+12-(boss.x+60));
                const a = baseA + (si-(sp-1)/2)*0.22, spd=5.5;
                bullets.push({x:boss.x+60, y:boss.y+85, v:Math.sin(a)*spd, vx:Math.cos(a)*spd, enemy:true, width:5});
            }
        }
        if(Math.hypot(player.x+12-(boss.x+60), player.y+12-(boss.y+45)) < 65) playerHit();
    }

    // Spawn enemies
    if(Math.random() < (lvl.spawnRate||0) + currentLevelIdx*0.002) spawnEnemy();

    // Random events (non-boss levels only)
    if(!boss && !lvl.boss) {
        if(bonusScrapActive) { bonusScrapTimer--; if(bonusScrapTimer<=0) bonusScrapActive=false; }
        // Endless mode: boss spawn + wave counter
        if(endlessMode) {
            if(killCount >= endlessNextBoss) {
                endlessNextBoss += 50;
                const bossLvl = LEVELS[Math.floor(Math.random()*LEVELS.length)];
                if(bossLvl.boss && !boss) {
                    boss = Object.assign({}, bossLvl.boss,
                        {x:W/2-60, y:-120, phase:0, shootTimer:120, hp:bossLvl.boss.maxHp, flashTimer:0, pattern:0, patternTimer:0});
                }
            }
            if(bossKilledThisLevel) { endlessWave++; bossKilledThisLevel=false; }
        }
        // Easter eggs: title tap decay, rainbow timer, corner invinc timer

                        }
                        if(bot.dlcSplit){for(let si=0;si<2;si++)bots.push({x:bot.x+(si-.5)*bot.size,y:bot.y,v:3.5,hp:1,maxHp:1,color:bot.color,size:14,type:'drone',drift:(Math.random()-.5)*2.5,shootTimer:0,flashTimer:0});}
                        if(bot.dlcFreezeOnDie){freezeTimer=Math.max(freezeTimer,120);floatingTexts.push({x:bot.x+bot.size/2,y:bot.y+bot.size/2,text:'FREEZE!',color:'#8ff',life:1.0,decay:0.025,vy:-1.5});}
                        if(bot.dlcRadialOnDie){for(let ri=0;ri<8;ri++){const ra=(ri/8)*Math.PI*2;bullets.push({x:bot.x+bot.size/2,y:bot.y+bot.size/2,v:Math.sin(ra)*3.5,vx:Math.cos(ra)*3.5,enemy:true,width:4});}}
                        killCount++;
                        if(!achievementsUnlocked.firstBlood) { achievementsUnlocked.firstBlood=true; achievementQueue.push({text:'FIRST BLOOD',timer:180}); }
                        if(healOnKillUpgrade > 0) {
                            healOnKillCount++;
                            const threshold = healOnKillUpgrade===1?10:healOnKillUpgrade===2?7:5;
                            if(healOnKillCount >= threshold) { healOnKillCount=0; if(player.hp<player.maxHp){player.hp++; floatingTexts.push({x:player.x+12,y:player.y,text:'+1 HP',color:'#0f0',life:1.0,decay:0.025,vy:-1.5});} }
                        }
                        if(Math.random()<0.20) powerups.push({x:bot.x+bot.size/2,y:bot.y+bot.size/2,type:'scrap',vy:1.2,life:300});
                        if(comboTimer > 0) { comboCount++; } else { comboCount = 1; }
                        comboTimer = 50;
                        if(comboCount >= 3) {
                            const comboBonus = comboCount * 2;
                            score += comboBonus;
                            scraps += Math.floor(comboCount/3);
                            floatingTexts.push({x:bot.x+bot.size/2,y:bot.y+bot.size/2-22,text:'COMBO x'+comboCount+'!',color:'#f0f',life:1.2,decay:0.018,vy:-1.8});
                            if(comboCount % 5 === 0) playSound('combo');
                        }
                        checkLevelComplete();
                    } else {
                        bot.flashTimer = 6;
                        spawnParticles(b.x, b.y, '#fff', 3);
                        floatingTexts.push({x:bot.x+bot.size/2,y:bot.y,text:b.crit?'2':'1',color:b.crit?'#ff0':'#fff',life:0.7,decay:0.04,vy:-2.5});
                    }
                    break;
                }
            }
        }
        if(!removed && (b.y<-25||b.y>H+25||b.x<-25||b.x>W+25)) bullets.splice(i,1);
    }

    if(nukeFlash > 0) {
        nukeFlash--;
        ctx.save();
        ctx.globalAlpha = nukeFlash/18 * 0.7;
        ctx.fillStyle='#ff8';
        ctx.fillRect(0,0,W,H);
        ctx.restore();
    }
    if(freezeTimer > 0) {
        freezeTimer--;
        ctx.save(); ctx.globalAlpha = 0.10;
        ctx.fillStyle='#8ff'; ctx.fillRect(0,0,W,H);
        ctx.restore();
    }
    if(overdriveTimer > 0) overdriveTimer--;
    if(shakeApplied) ctx.restore();
    drawHUD();
    requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
